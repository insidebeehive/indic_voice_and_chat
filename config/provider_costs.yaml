# Cost per minute, by kind → provider → model. Seeds the `provider_costs` table
# on first boot (missing rows only — existing rates are preserved). Maintained
# live via PUT /api/v1/providers/{kind}/{provider} (model in the body) or the
# Admin console's cost-catalog editor.
#
# STT/LLM/TTS/S2S are priced per model variant. Telephony has no model, so it's
# given as a single scalar per provider (stored with model="").
#
# Units: USD/min — APPROXIMATE market estimates (early 2026) to make the cost
# estimate meaningful out of the box; replace with your contracted rates.
# LLM/STT are token/char-priced upstream; modeled here per-minute from typical
# voice-agent usage (~150 words/min of dialogue).
stt:
  sarvam:
    "saaras:v3": 0.006
  groq:
    whisper-large-v3: 0.002
    whisper-large-v3-turbo: 0.0015
  deepgram:
    nova-2: 0.0043
    nova-3: 0.0058
llm:
  gemini:
    # TODO verify against Google's published 3.5-flash pricing; seeded at the
    # 2.5-flash rate so billing keeps producing a figure after the model swap.
    gemini-3.5-flash: 0.002
    gemini-2.5-flash: 0.002
    gemini-2.5-flash-lite: 0.0008
    gemini-2.5-pro: 0.012
    gemini-2.0-flash: 0.0015
    gemini-2.0-flash-lite: 0.0006
  vllm:
    # Self-hosted on the IndicF5 RunPod pod — marginal per-request cost ~0
    # (pod cost is already carried; adjust if a dedicated pod is added).
    Qwen/Qwen2.5-14B-Instruct-AWQ: 0.0
  groq:
    llama-3.3-70b-versatile: 0.0012
    llama-3.1-8b-instant: 0.0003
  anthropic:
    claude-haiku-4-5: 0.002
    claude-sonnet-4-6: 0.008
    claude-opus-4-8: 0.04
tts:
  sarvam:
    "bulbul:v2": 0.015
    "bulbul:v3": 0.018
    "bulbul:v3-beta": 0.018
  indicf5:
    # Self-hosted on RunPod — no per-request provider fee; this figure should
    # reflect amortized pod cost per audio-minute (adjust to actual pod rate).
    indicf5-finetuned: 0.005
s2s:
  gemini_live:
    gemini-3.1-flash-live-preview: 0.03
    gemini-2.5-flash-live-preview: 0.03
telephony:
  twilio: 0.014
  exotel: 0.007
  stringee: 0.010
  # LiveKit room-join bridge: no PSTN per-minute leg (the CRM partner hands us
  # an already-established room), so there's no equivalent carrier cost yet.
  # Tentative-only either way (see call_store.py's platform-billed-total
  # exclusion) — 0 until a real per-minute figure (e.g. LiveKit Cloud
  # participant-minutes) is contracted.
  livekit: 0.0

# Chat (text) is billed per-token, not per-minute, so it gets its own rate
# shape (kind → provider → model → {input_per_1k, output_per_1k}) rather than
# reusing the per-minute keys above. Seeded onto the matching (kind="llm",
# provider, model) provider_costs row by seed_provider_costs — see
# src/api/chat_cost.py for the read side. Units: USD per 1,000 tokens,
# APPROXIMATE market estimates (early 2026); replace with contracted rates.
llm_token_rates:
  gemini:
    # cached_per_1k: $0.15 / 1M tokens, confirmed 2026-09-17 against Google's
    # own published pricing (ai.google.dev/gemini-api/docs/pricing, Gemini
    # 3.5 Flash row, "Context caching price", paid tier) — not an estimate,
    # unlike input_per_1k/output_per_1k above (see this file's own "seeded at
    # the 2.5-flash rate" TODO). Cached rates are NOT uniform across Gemini
    # model generations (the same pricing page lists 2.5 Flash's context
    # caching price as $0.03/1M, less than a fifth of this), so this is
    # intentionally set only on the exact gemini-3.5-flash row, not mirrored
    # onto the "" fallback below the way input/output are — mirroring it
    # would silently apply the wrong model's cache discount to whatever other
    # gemini variant falls back to this row.
    # input/output confirmed 2026-09-17 against the same published pricing as
    # cached_per_1k above ($1.50 and $9.00 per 1M). They previously carried the
    # 2.5-flash estimates ($0.30/$2.50 per 1M) left behind by the model swap,
    # which under-reported chat cost by roughly 4x. Corroborated independently
    # of the pricing page: September's reported spend under the old rates was
    # ~$78, while the account's actual $300 monthly cap was reached and blocked
    # over the same period — so real spend was at least ~4x what this file
    # was reporting. $300 is a floor, not the uncapped total.
    gemini-3.5-flash: {input_per_1k: 0.0015, output_per_1k: 0.009, cached_per_1k: 0.00015}
    # Provider-level fallback (model="") used by token_rates() in
    # src/api/chat_cost.py when pipeline.llm.model is swapped to a gemini
    # model with no dedicated row above — keeps chat cost tracking from
    # silently going to $0.00 after a model change. Mirrors gemini-3.5-flash's
    # input/output rates until per-model rates are added for the other gemini
    # variants; deliberately carries no cached_per_1k of its own (see above) —
    # a variant that lands here bills cached tokens at this in_rate instead,
    # via compute_chat_turn_cost's unconfigured-rate fallback.
    #
    # Now that gemini-3.5-flash carries its real (5x higher) rates, mirroring
    # them here means an OLDER, cheaper variant landing on this row is
    # over-reported rather than under-reported — 2.5-flash is genuinely
    # $0.30/1M input, a fifth of this. That direction is deliberate: a cost
    # figure that reads high prompts someone to add a dedicated row, whereas
    # one that reads low is what let a spending cap be sized at roughly a
    # third of one month's real traffic. The fix for any specific variant is
    # its own row above, not lowering this.
    "": {input_per_1k: 0.0015, output_per_1k: 0.009}
  groq:
    # No per-model rows yet (only per-minute rates exist for groq above).
    # Provider-level fallback so switching the platform LLM provider to groq
    # doesn't silently zero out chat billing. APPROXIMATE — roughly in line
    # with published llama-3.3-70b-versatile per-token pricing.
    "": {input_per_1k: 0.0006, output_per_1k: 0.0008}
  anthropic:
    # Provider-level fallback, same rationale as groq above. APPROXIMATE —
    # roughly in line with published mid-tier (sonnet-class) per-token
    # pricing.
    "": {input_per_1k: 0.003, output_per_1k: 0.015}
