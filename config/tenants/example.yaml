id: t_example
slug: example
name: Example Telecom
status: active
default_language: hi

pipeline:
  stt:
    provider: sarvam
    model: saaras:v3
    language: hi-IN
    # no api_key_env needed — STT/LLM/TTS/realtime always use the platform master key
  llm:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.7
    # no api_key_env needed — STT/LLM/TTS/realtime always use the platform master key
  tts:
    provider: sarvam
    model: bulbul:v2
    language: hi-IN
    voice_id: anushka
    # no api_key_env needed — STT/LLM/TTS/realtime always use the platform master key
  telephony:
    provider: twilio
    from_number: "+918888888888"
    account_sid_env: TENANT_EXAMPLE_TWILIO_SID
    auth_token_env: TENANT_EXAMPLE_TWILIO_TOKEN
  vector_store:
    provider: faiss

compliance:
  calling_hours_start: "10:00"
  calling_hours_end: "19:00"
  dnd_check_enabled: true

crm:
  kind: fake

whatsapp:
  provider: fake

phone_numbers:
  - "+918888888888"
