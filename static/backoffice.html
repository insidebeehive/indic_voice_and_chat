<!-- static/backoffice.html — ADMIN backoffice: tenant list + per-tenant
     analytics & billing. Admin bearer only; every panel is a live /api/v1 call. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vox Backoffice</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin:0; background:#0a0a0a; color:#e2e8f0; }
  header { padding:.75rem 1rem; background:#3b0764; border-bottom:1px solid #1f2937; }
  header h1 { font-size:1.05rem; margin:0 0 .5rem; }
  .creds { display:flex; gap:.75rem; flex-wrap:wrap; align-items:flex-end; }
  label { font-size:.8rem; color:#cbd5e1; display:flex; flex-direction:column; gap:.2rem; }
  input { background:#0b1220; color:#e2e8f0; border:1px solid #334155; border-radius:.35rem; padding:.4rem; font:inherit; }
  button { padding:.4rem .8rem; border-radius:.4rem; border:0; cursor:pointer; font-weight:600; background:#ea580c; color:#fff; }
  button.ghost { background:#334155; color:#e2e8f0; }
  button.sm { padding:.25rem .5rem; font-size:.75rem; }
  .wrap { padding:1rem; }
  .card { background:#0f1115; border:1px solid #1f2430; border-radius:.6rem; padding:1rem 1.1rem; margin-bottom:1rem; }
  .card h2 { font-size:.95rem; margin:.1rem 0 .7rem; color:#cbd5e1; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; }
  th, td { text-align:left; padding:.45rem .5rem; border-bottom:1px solid #1f2937; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#141a24; }
  tbody tr.sel { background:#1e293b; }
  .pill { font-size:.7rem; padding:.05rem .4rem; border-radius:.3rem; background:#334155; }
  .pill.s2s { background:#0c4a6e; } .pill.layered { background:#3f2d12; }
  .hint { color:#8a94a6; font-size:.75rem; }
  .tabs { display:flex; gap:.4rem; margin-bottom:.7rem; }
  .tab { padding:.35rem .8rem; border-radius:.4rem; background:#1a1f29; color:#cbd5e1; cursor:pointer; font-size:.85rem; }
  .tab.active { background:#3b82f6; color:#fff; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.7rem; }
  .stat { background:#0b1220; border:1px solid #243042; border-radius:.5rem; padding:.7rem .8rem; }
  .stat .v { font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat .k { font-size:.72rem; color:#8a94a6; text-transform:uppercase; letter-spacing:.03em; }
  .stat.tnt .v { color:#94a3b8; font-style:italic; }
  .kv { font-size:.82rem; } .kv div { padding:.15rem 0; border-bottom:1px solid #141a24; }
  a { color:#93c5fd; }
</style>
</head>
<body>
<header>
  <h1>Vox Backoffice <span class="hint">— tenants · analytics · billing · <a href="/admin">register</a> · <a href="/console">tenant console</a></span></h1>
  <div class="creds">
    <label>API base URL <input id="baseUrl" style="width:15rem" placeholder="(same origin)" /></label>
    <label>Admin token <input id="adminToken" style="width:16rem" placeholder="Bearer for admin routes" /></label>
    <button class="ghost sm" onclick="saveCreds()">Save</button>
    <button class="ghost sm" onclick="loadTenants()">Reload</button>
    <span id="credsHint" class="hint"></span>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Tenants <span class="hint">(click a row to see analytics &amp; billing)</span></h2>
    <div id="tlist"><span class="hint">Enter your admin token + Save to load tenants.</span></div>
  </div>

  <div class="card" id="detail" hidden>
    <h2 id="detailTitle">Tenant</h2>
    <div class="tabs">
      <div class="tab active" id="tab_an" onclick="showTab('an')">Analytics</div>
      <div class="tab" id="tab_bill" onclick="showTab('bill')">Billing</div>
      <div class="tab" id="tab_tel" onclick="showTab('tel')">Telephony</div>
      <div class="tab" id="tab_camp" onclick="showTab('camp')">Campaign</div>
      <div class="tab" id="tab_chat" onclick="showTab('chat')">Chat</div>
    </div>
    <div id="pane_an"></div>
    <div id="pane_bill" hidden></div>
    <div id="pane_tel" hidden></div>
    <div id="pane_camp" hidden></div>
    <div id="pane_chat" hidden></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function loadCreds() {
  $("baseUrl").value    = localStorage.getItem("vox_base")  || "";
  $("adminToken").value = localStorage.getItem("vox_admin") || "";
}
function saveCreds() {
  localStorage.setItem("vox_base",  $("baseUrl").value.trim());
  localStorage.setItem("vox_admin", $("adminToken").value.trim());
  $("credsHint").textContent = "saved"; setTimeout(() => $("credsHint").textContent = "", 1200);
  loadTenants();
}
const base = () => ($("baseUrl").value.trim() || window.location.origin).replace(/\/$/, "");
const fmt = (c) => "$" + (Number(c) || 0).toFixed(4);
const mins = (ms) => ((Number(ms) || 0) / 60000).toFixed(1);

async function api(path) {
  const headers = {};
  const t = $("adminToken").value.trim();
  if (t) headers["Authorization"] = "Bearer " + t;
  try {
    const res = await fetch(base() + path, { headers });
    const json = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, json };
  } catch (e) { return { ok: false, status: 0, json: { error: String(e) } }; }
}

async function apiSend(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  const t = $("adminToken").value.trim();
  if (t) headers["Authorization"] = "Bearer " + t;
  try {
    const res = await fetch(base() + path, { method, headers, body: JSON.stringify(body) });
    const json = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, json };
  } catch (e) { return { ok: false, status: 0, json: { error: String(e) } }; }
}

const lay = (l) => l && l.provider ? `${l.provider}${l.model ? " · " + l.model : ""}` : "—";
let SELECTED = null;

async function loadTenants() {
  const r = await api("/api/v1/tenants");
  if (!r.ok) { $("tlist").innerHTML = `<span class="hint">Could not load (${r.status}). Check the admin token.</span>`; return; }
  const ts = r.json.tenants || [];
  window.TENANTS = {};
  ts.forEach(t => { window.TENANTS[t.tenant_id] = t; });
  if (!ts.length) { $("tlist").innerHTML = `<span class="hint">No tenants yet — register one on <a href="/admin">/admin</a>.</span>`; return; }
  $("tlist").innerHTML = `<table><thead><tr>
      <th>slug</th><th>name</th><th>mode</th><th>LLM</th><th>STT</th><th>TTS</th>
      <th>Realtime</th><th>Telephony</th><th>max</th><th>status</th></tr></thead>
    <tbody>${ts.map(t => `<tr data-id="${t.tenant_id}" onclick="selectTenant('${t.tenant_id}','${t.slug}')">
      <td>${t.slug}</td><td>${t.name}</td>
      <td><span class="pill ${t.mode}">${t.mode}</span></td>
      <td>${lay(t.llm)}</td><td>${lay(t.stt)}</td><td>${lay(t.tts)}</td>
      <td>${lay(t.realtime)}</td><td>${t.telephony_provider || "—"}</td>
      <td>${t.max_concurrent_calls}</td><td>${t.status}</td></tr>`).join("")}</tbody></table>`;
}

async function selectTenant(id, slug) {
  SELECTED = id;
  for (const tr of document.querySelectorAll("#tlist tbody tr"))
    tr.classList.toggle("sel", tr.dataset.id === id);
  $("detail").hidden = false;
  $("detailTitle").textContent = `Tenant: ${slug}`;
  showTab("an");
  await loadAnalytics(id);
  await loadBilling(id);
  loadTelephony(id);
  loadCampaigns(id);
  loadChat(id, slug);
}
function showTab(which) {
  for (const k of ["an", "bill", "tel", "camp", "chat"]) {
    $("tab_" + k).classList.toggle("active", which === k);
    $("pane_" + k).hidden = which !== k;
  }
}

function statBox(k, v, cls) { return `<div class="stat ${cls || ""}"><div class="v">${v}</div><div class="k">${k}</div></div>`; }

async function loadAnalytics(id) {
  const r = await api(`/api/v1/tenants/${id}/analytics`);
  if (!r.ok) { $("pane_an").innerHTML = `<span class="hint">analytics error ${r.status}</span>`; return; }
  const a = r.json;
  const rows = (obj) => Object.keys(obj).length
    ? Object.entries(obj).map(([k, v]) => `<div>${k}: <b>${v}</b></div>`).join("") : '<span class="hint">none</span>';
  $("pane_an").innerHTML = `
    <div class="stats">
      ${statBox("Total calls", a.total_calls)}
      ${statBox("Total minutes", mins(a.total_duration_ms))}
      ${statBox("Avg call (min)", mins(a.avg_duration_ms))}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-top:.8rem;">
      <div><h2>By status</h2><div class="kv">${rows(a.by_status)}</div></div>
      <div><h2>By outcome</h2><div class="kv">${rows(a.by_outcome)}</div></div>
      <div><h2>By campaign</h2><div class="kv">${rows(a.by_campaign || {})}</div></div>
      <div><h2>By call type</h2><div class="kv">${rows(a.by_agent_type || {})}</div></div>
      <div><h2>By channel</h2><div class="kv">${rows(a.by_channel || {})}</div></div>
      <div><h2>By provider</h2><div class="kv">${rows(a.by_provider || {})}</div></div>
    </div>`;
}

async function loadBilling(id) {
  const r = await api(`/api/v1/tenants/${id}/billing`);
  if (!r.ok) { $("pane_bill").innerHTML = `<span class="hint">billing error ${r.status}</span>`; return; }
  const b = r.json;
  $("pane_bill").innerHTML = `
    <div class="stats">
      ${statBox("Platform cost", fmt(b.platform_cost))}
      ${statBox("Total calls", b.total_calls)}
      ${statBox("Billable minutes", b.billable_minutes)}
      ${statBox("Avg / call", fmt(b.avg_cost_per_call))}
      ${statBox("Telephony (tentative)", "~" + fmt(b.tentative_telephony_cost), "tnt")}
    </div>
    <div class="hint" style="margin-top:.6rem;">Platform cost = STT/LLM/TTS or S2S (what we bill). Telephony runs on the
      tenant's own provider key, so it's shown as a tentative figure and is <b>not</b> in the platform cost.</div>`;
}

// Credential fields per provider — [logical_name, label, isSecret]. Only the
// fields a provider actually uses are shown when it's selected.
const TEL_FIELDS = {
  stringee:   [["account_sid","API Key SID",false],["auth_token","API Key Secret",true],["user_id","User ID (e.g. dev)",false]],
  twilio:     [["account_sid","Account SID",false],["auth_token","Auth Token",true],["api_key_sid","API Key SID (softphone)",false],["api_key_secret","API Key Secret (softphone)",true],["twiml_app_sid","TwiML App SID (softphone)",false]],
  exotel:     [["account_sid","API Key / SID",false],["auth_token","API Token",true]],
  infobip:    [["account_sid","API Key",false],["auth_token","API Secret",true]],
  telnyx:     [["account_sid","API Key / SID",false],["auth_token","API Secret",true]],
  webconsole: [],
};
const escAttr = (s) => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

function renderTelKeyFields() {
  const fields = TEL_FIELDS[$("te_provider").value] || [];
  $("te_keyfields").innerHTML = fields.length
    ? `<div class="creds" style="gap:.6rem;margin-top:.5rem;">${fields.map(([logical,label,secret]) =>
        `<label>${label} <input data-logical="${logical}" type="${secret ? "password" : "text"}" placeholder="new value (blank = keep)" /></label>`).join("")}</div>`
    : `<span class="hint">No credentials for this provider.</span>`;
}
function editTelKeys() { $("te_keybox").hidden = false; $("te_editbtn").hidden = true; renderTelKeyFields(); }
function onTelProviderChange() { if (!$("te_keybox").hidden) renderTelKeyFields(); }  // re-render for new provider while editing

function loadTelephony(id) {
  const t = (window.TENANTS || {})[id] || {};
  const cfg = t.telephony_creds_configured || [];
  $("pane_tel").innerHTML = `
    <div class="hint" style="margin-bottom:.6rem;">Update this tenant's telephony config. Credential values are
      <b>encrypted &amp; write-only</b> — never shown; click <b>Edit keys</b> to set new ones. PATCHes
      <code>/api/v1/tenants/${id}</code>; the live resolver refreshes immediately.</div>
    <div class="creds" style="gap:.6rem;">
      <label>provider <select id="te_provider" onchange="onTelProviderChange()">${
        ["stringee","twilio","exotel","infobip","telnyx","webconsole"]
          .map(p => `<option value="${p}"${p === (t.telephony_provider || "") ? " selected" : ""}>${p}</option>`).join("")
      }</select></label>
      <label>from_number <input id="te_from" value="${escAttr(t.telephony_from_number)}" placeholder="+91… / 91…" /></label>
      <label>Stringee REST base <small class="hint">(regional host)</small>
        <input id="te_strbase" style="width:18rem" value="${escAttr(t.telephony_stringee_base_url)}" placeholder="https://asia-2.api.stringee.com (blank = api.stringee.com)" /></label>
    </div>
    <h2 style="margin-top:.9rem;">Stringee webhook URLs <small class="hint">(paste into this tenant's Stringee project — read-only)</small></h2>
    <div class="creds" style="gap:.6rem;">
      <label>Softphone Answer URL <input style="width:30rem" readonly onclick="this.select()" value="${escAttr(t.stringee_softphone_answer_url)}" /></label>
      <label>Voicebot Answer URL <input style="width:30rem" readonly onclick="this.select()" value="${escAttr(t.stringee_answer_url)}" /></label>
    </div>
    <h2 style="margin-top:.9rem;">Credentials</h2>
    <div class="hint">Configured: ${cfg.length ? `<b>${cfg.map(c => c.replace(/_env$/,"")).join(", ")}</b>` : "none"} <small>(names only — values hidden)</small></div>
    <div style="margin-top:.4rem;"><button id="te_editbtn" class="ghost sm" onclick="editTelKeys()">Edit keys</button></div>
    <div id="te_keybox" hidden><div id="te_keyfields"></div></div>
    <h2 style="margin-top:.9rem;">Outbound events webhook <small class="hint">(tenant CRM callback)</small></h2>
    <div class="creds" style="gap:.6rem;">
      <label>events_webhook_url <input id="te_ewurl" style="width:22rem" value="${escAttr(t.telephony_events_webhook_url)}" placeholder="https://crm…/events" /></label>
      <label>signing secret <small class="hint">(${t.telephony_events_webhook_secret_set ? "set" : "not set"} · X-Signature HMAC; blank = keep)</small>
        <input id="te_ewsecret" type="password" placeholder="paste the CRM's webhookSecret value" /></label>
    </div>
    <div style="margin-top:.9rem;">
      <button onclick="saveTelephony('${id}')">Save telephony</button>
      <span id="te_result" class="hint" style="margin-left:.6rem;"></span>
    </div>`;
}

async function saveTelephony(id) {
  const v = (x) => { const el = $(x); return el ? (el.value || "").trim() : ""; };
  const tel = {};
  if (v("te_provider")) tel.provider = v("te_provider");
  if (v("te_from")) tel.from_number = v("te_from");
  if (v("te_strbase")) tel.stringee_base_url = v("te_strbase");
  if (v("te_ewurl")) tel.events_webhook_url = v("te_ewurl");
  const keys = {};
  if (v("te_ewsecret")) keys.events_webhook_secret = v("te_ewsecret");   // stored encrypted, signs the events
  document.querySelectorAll("#te_keyfields input[data-logical]").forEach(el => {
    const val = (el.value || "").trim();
    if (val) keys[el.dataset.logical] = val;
  });
  if (Object.keys(keys).length) tel.keys = keys;
  if (!Object.keys(tel).length) { $("te_result").textContent = "nothing to update"; return; }
  $("te_result").textContent = "saving…";
  const r = await apiSend("PATCH", `/api/v1/tenants/${id}`, { telephony: tel });
  if (r.ok) {
    await loadTenants();      // refresh window.TENANTS, then re-render the pane (collapses Edit keys)
    loadTelephony(id);
    $("te_result").textContent = "✓ saved — resolver refreshed";
  } else {
    $("te_result").textContent = `✗ ${r.status}: ${r.json.detail || r.json.error || "error"}`;
  }
}

// --- Campaign script editor ---------------------------------------------
let CAMPAIGNS = {};   // campaign_id -> {id, name, status, script}
const _lines = (a) => (a || []).join("\n");
const _toList = (s) => (s || "").split("\n").map(x => x.trim()).filter(Boolean);
const escA = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const escT = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

async function loadCampaigns(id) {
  const r = await api(`/api/v1/tenants/${id}/campaigns`);
  if (!r.ok) { $("pane_camp").innerHTML = `<span class="hint">campaigns error ${r.status}</span>`; return; }
  const camps = r.json.campaigns || [];
  CAMPAIGNS = {};
  camps.forEach(c => { CAMPAIGNS[c.id] = c; });
  if (!camps.length) { $("pane_camp").innerHTML = `<span class="hint">No campaigns for this tenant.</span>`; return; }
  const opts = camps.map(c => `<option value="${escA(c.id)}">${escT(c.name)} (${c.status})</option>`).join("");
  $("pane_camp").innerHTML = `
    <div class="hint" style="margin-bottom:.6rem;">Edit the voicebot script. Saved to the campaign in the DB
      and read live on the next call (no redeploy). PATCHes <code>/api/v1/tenants/${id}/campaigns/&lt;id&gt;</code>.</div>
    <label>Campaign <select id="c_select" onchange="renderCampaignForm('${id}')">${opts}</select></label>
    <div id="c_form" style="margin-top:.7rem;"></div>`;
  renderCampaignForm(id);
}

function _field(label, fid, val, ta) {
  return ta
    ? `<label style="flex:1 1 100%;">${label}<textarea id="${fid}" rows="2" style="width:100%;">${escT(val)}</textarea></label>`
    : `<label>${label}<input id="${fid}" value="${escA(val)}" /></label>`;
}

function renderCampaignForm(tenantId) {
  const c = CAMPAIGNS[$("c_select").value];
  if (!c) return;
  const s = c.script || {};
  const kn = s.knowledge || {};
  const knRows = Object.entries(kn).map(([k, v]) =>
    `<div class="creds" data-kn-row style="gap:.4rem;">
       <input data-kn-key value="${escA(k)}" placeholder="key" style="width:11rem;" />
       <input data-kn-val value="${escA(v)}" placeholder="response" style="flex:1 1 20rem;" /></div>`).join("");
  $("c_form").innerHTML = `
    <div class="creds" style="gap:.6rem;">
      ${_field("Campaign name", "c_name", c.name)}
      ${_field("Agent name", "c_agent_name", s.agent_name)}
      ${_field("Company", "c_company", s.company)}
      ${_field("Role", "c_role", s.role)}
      ${_field("Personality", "c_personality", s.personality)}
      ${_field("Language", "c_language", s.language)}
      ${_field("Gender", "c_gender", s.gender)}
      ${_field("Conversation style", "c_conversation_style", s.conversation_style)}
      ${_field("Max turns", "c_max_turns", s.max_turns)}
    </div>
    <div class="creds" style="gap:.6rem;margin-top:.5rem;">
      ${_field("Greeting", "c_greeting", s.greeting, true)}
      ${_field("Objective", "c_objective", s.objective, true)}
      ${_field("Closing", "c_closing", s.closing, true)}
      ${_field("Talking points (one per line)", "c_talking_points", _lines(s.talking_points), true)}
      ${_field("Do's (one per line)", "c_dos", _lines(s.dos), true)}
      ${_field("Don'ts (one per line)", "c_donts", _lines(s.donts), true)}
    </div>
    <h2 style="margin-top:.7rem;">Knowledge / objection responses</h2>
    <div id="c_knowledge">${knRows}</div>
    <button class="ghost sm" onclick="document.getElementById('c_knowledge').insertAdjacentHTML('beforeend', _knRow())">+ add</button>
    <div style="margin-top:.8rem;">
      <button onclick="saveCampaign('${tenantId}', '${escA(c.id)}')">Save script</button>
      <span id="c_result" class="hint" style="margin-left:.6rem;"></span>
    </div>`;
}

function _knRow() {
  return `<div class="creds" data-kn-row style="gap:.4rem;">
    <input data-kn-key placeholder="key" style="width:11rem;" />
    <input data-kn-val placeholder="response" style="flex:1 1 20rem;" /></div>`;
}

async function saveCampaign(tenantId, campId) {
  const v = (x) => ($(x).value || "").trim();
  const knowledge = {};
  document.querySelectorAll("#c_knowledge [data-kn-row]").forEach(row => {
    const k = (row.querySelector("[data-kn-key]").value || "").trim();
    const val = (row.querySelector("[data-kn-val]").value || "").trim();
    if (k) knowledge[k] = val;
  });
  const body = {
    name: v("c_name"), agent_name: v("c_agent_name"), company: v("c_company"),
    role: v("c_role"), personality: v("c_personality"), language: v("c_language"),
    gender: v("c_gender"), conversation_style: v("c_conversation_style"),
    max_turns: Number(v("c_max_turns")) || 0,
    greeting: v("c_greeting"), objective: v("c_objective"), closing: v("c_closing"),
    talking_points: _toList(v("c_talking_points")), dos: _toList(v("c_dos")),
    donts: _toList(v("c_donts")), knowledge,
  };
  $("c_result").textContent = "saving…";
  const r = await apiSend("PUT", `/api/v1/tenants/${tenantId}/campaigns/${campId}`, body);
  if (r.ok) {
    CAMPAIGNS[campId] = r.json;        // refresh from the server's re-parsed script
    $("c_result").textContent = "✓ saved — live on the next call";
  } else {
    $("c_result").textContent = `✗ ${r.status}: ${r.json.detail || r.json.error || "error"}`;
  }
}

// --- Chat tab -----------------------------------------------------------

async function apiTenant(method, path, body, slug) {
  const headers = { "Content-Type": "application/json", "X-Tenant-Slug": slug };
  const t = $("adminToken").value.trim();
  if (t) headers["Authorization"] = "Bearer " + t;
  try {
    const res = await fetch(base() + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const json = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, json };
  } catch (e) { return { ok: false, status: 0, json: { error: String(e) } }; }
}

async function loadChat(id, slug) {
  const r = await apiTenant("GET", "/api/v1/chat/tools", null, slug);
  const tools = r.ok ? (r.json.tools || []) : [];
  const toolRows = tools.length
    ? tools.map(t => `<tr>
        <td>${escT(t.name)}</td>
        <td style="max-width:22rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escAttr(t.endpoint)}">${escT(t.endpoint)}</td>
        <td>${escT(t.auth_type || "—")}</td>
        <td>${t.auth_configured ? "✓" : "—"}</td>
        <td><button class="ghost sm" onclick="deleteTool('${escAttr(slug)}','${escAttr(t.name)}')">Remove</button></td>
      </tr>`).join("")
    : `<tr><td colspan="5" class="hint">No tools registered yet.</td></tr>`;

  $("pane_chat").innerHTML = `
    <div class="hint" style="margin-bottom:.6rem;">
      Register CRM API tools the chatbot may call. Use <b>Seed from catalog</b> to register all
      standard betting-platform tools at once (wallet, bets, transactions, bonuses, profile,
      operator config, etc.).
    </div>

    <h2>Registered tools</h2>
    <table style="margin-bottom:.8rem;">
      <thead><tr><th>Name</th><th>Endpoint</th><th>Auth type</th><th>Token set</th><th></th></tr></thead>
      <tbody id="ch_toolrows">${toolRows}</tbody>
    </table>

    <h2>Seed from catalog</h2>
    <div class="hint" style="margin-bottom:.5rem;">
      Registers all standard CRM tools for this tenant. Existing tools with the same name are updated (upsert).
    </div>
    <div class="creds" style="gap:.6rem;flex-wrap:wrap;">
      <label>CRM base URL
        <input id="ch_base" style="width:22rem" placeholder="https://apistage.betstudio.io/api" />
      </label>
      <label>Auth type
        <select id="ch_authtype">
          <option value="api_key">api_key (X-API-Key header)</option>
          <option value="bearer">bearer (Authorization: Bearer)</option>
        </select>
      </label>
      <label>CRM API token <small class="hint">(encrypted at rest)</small>
        <input id="ch_token" type="password" style="width:18rem" placeholder="token value" />
      </label>
      <label>Operator ID <small class="hint">(sent as operatorid header)</small>
        <input id="ch_opid" style="width:16rem" placeholder="ab858a8c-7ad4-47d2-a0b7-…" />
      </label>
    </div>
    <div style="margin-top:.8rem;">
      <button onclick="saveCrmConfig('${escAttr(slug)}')">Seed / update CRM tools</button>
      <span id="ch_result" class="hint" style="margin-left:.6rem;"></span>
    </div>`;
}

async function saveCrmConfig(slug) {
  const crm_base_url = $("ch_base").value.trim();
  const auth_type    = $("ch_authtype").value;
  const auth_token   = $("ch_token").value.trim();
  const operator_id  = $("ch_opid").value.trim();
  if (!crm_base_url) { $("ch_result").textContent = "CRM base URL is required"; return; }
  const body = { crm_base_url, auth_type };
  if (auth_token)  body.auth_token  = auth_token;
  if (operator_id) body.operator_id = operator_id;
  $("ch_result").textContent = "saving…";
  const r = await apiTenant("POST", "/api/v1/chat/tools/from-catalog", body, slug);
  if (r.ok) {
    $("ch_result").textContent = `✓ ${r.json.registered} tools registered: ${(r.json.tool_names || []).join(", ")}`;
  } else {
    $("ch_result").textContent = `Error ${r.status}: ${r.json.detail || JSON.stringify(r.json)}`;
  }
}

async function deleteTool(slug, name) {
  if (!confirm(`Remove tool "${name}"?`)) return;
  const r = await apiTenant("DELETE", `/api/v1/chat/tools/${encodeURIComponent(name)}`, null, slug);
  if (r.ok) {
    const row = document.querySelector(`#ch_toolrows tr td:first-child`);
    // Reload the whole pane — find the tenant id from SELECTED
    const t = (window.TENANTS || {})[SELECTED] || {};
    loadChat(SELECTED, t.slug || slug);
  }
}

loadCreds(); loadTenants();
</script>
</body>
</html>
