<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChatBot — reference widget</title>
<style>
  :root { --bg:#f5f6f8; --agent:#fff; --cust:#2563eb; --cust-fg:#fff; }
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { margin:0; background:var(--bg); display:flex; justify-content:center; }
  #app { width:100%; max-width:480px; height:100vh; display:flex; flex-direction:column; background:var(--bg); }
  header { padding:.8rem 1rem; background:#111827; color:#fff; font-weight:600; }
  #setup { padding:1rem; display:flex; flex-direction:column; gap:.5rem; }
  #setup input { padding:.5rem; border:1px solid #d1d5db; border-radius:6px; }
  #setup button, #composer button { padding:.5rem .9rem; border:0; border-radius:6px; background:var(--cust); color:#fff; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.5rem; }
  .msg { max-width:78%; padding:.55rem .8rem; border-radius:14px; line-height:1.45; }
  .msg.agent { background:var(--agent); align-self:flex-start; border:1px solid #e5e7eb; }
  .msg.agent ul,.msg.agent ol { margin:.2rem 0 .2rem 1.2rem; padding:0; }
  .msg.agent li { margin:.1rem 0; }
  .msg.agent strong { font-weight:600; }
  .msg.agent em { font-style:italic; }
  .msg.customer { background:var(--cust); color:var(--cust-fg); align-self:flex-end; white-space:pre-wrap; }
  .meta { font-size:.7rem; color:#6b7280; align-self:flex-start; }
  #typing { font-style:italic; color:#6b7280; padding:0 1rem .4rem; height:1.1rem; }
  #suggestions { display:flex; gap:.4rem; flex-wrap:wrap; padding:0 1rem .4rem; }
  #suggestions button { background:#e5e7eb; color:#111827; border:0; border-radius:14px; padding:.35rem .7rem; cursor:pointer; font-size:.8rem; }
  #composer { display:flex; gap:.5rem; padding:.7rem; border-top:1px solid #e5e7eb; background:#fff; align-items:center; }
  #composer input[type="text"] { flex:1; padding:.6rem; border:1px solid #d1d5db; border-radius:8px; }
  #attach-btn { background:none; border:none; font-size:1.2rem; cursor:pointer; padding:.3rem; color:#6b7280; line-height:1; }
  #attach-btn:hover { color:#111827; }
  #mic-btn { background:none; border:none; font-size:1.2rem; cursor:pointer; padding:.3rem; color:#6b7280; line-height:1; }
  #mic-btn:hover { color:#111827; }
  #mic-btn.recording { color:#dc2626; }
  #call-btn { background:none; border:none; font-size:1.2rem; cursor:pointer; padding:.3rem; color:#6b7280; line-height:1; }
  #call-btn:hover { color:#16a34a; }
  #call-btn:disabled { opacity:.4; cursor:not-allowed; }
  #rec-timer { display:none; color:#dc2626; font-size:.85em; font-weight:600; }
  #file-input { display:none; }
  #preview-bar { display:none; align-items:center; gap:.5rem; padding:.4rem .7rem; background:#f0f9ff; border-top:1px solid #bae6fd; font-size:.8rem; color:#0369a1; }
  #preview-bar button { background:none; border:none; cursor:pointer; color:#64748b; font-size:1rem; line-height:1; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="app">
  <header>Support Chat <span id="status" style="font-weight:400;opacity:.7"></span></header>
  <div id="setup">
    <input id="base" placeholder="API base (e.g. http://localhost:8000)" value="" />
    <input id="token" placeholder="Tenant bearer token" />
    <input id="userid" placeholder="User ID (logged-in player ID)" />
    <input id="name" placeholder="Player name (optional)" />
    <button id="start">Start chat</button>
    <small style="color:#6b7280">Demo only — a real CRM creates the session server-side and embeds the returned <code>ws_url</code>.</small>
  </div>
  <div id="log" class="hidden"></div>
  <div id="typing"></div>
  <div id="suggestions"></div>
  <div id="preview-bar">
    <span id="preview-name"></span>
    <button id="preview-clear" title="Remove">✕</button>
  </div>
  <div id="composer" class="hidden">
    <button id="call-btn" title="Start voice call" disabled>📞</button>
    <button id="attach-btn" title="Attach image or video">📎</button>
    <input id="file-input" type="file" accept="image/*,video/*" />
    <button id="mic-btn" title="Record voice message" onclick="toggleRecording()">🎤</button>
    <span id="rec-timer">0:00</span>
    <input id="text" type="text" placeholder="Type a message…" autocomplete="off" />
    <button id="send">Send</button>
    <button id="end" style="background:#9ca3af">End</button>
  </div>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let ws = null, sessionId = null;
  let _wsUrl = null, _sessionEnded = false, _reconnectDelay = 2000, _reconnectTimer = null;
  let pendingAudioBubble = null;

  function _esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function _inline(s) {
    s = _esc(s);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
    return s;
  }
  function renderMd(text) {
    const lines = text.split("\n");
    let html = "", inList = false, listTag = "";
    for (const raw of lines) {
      const bullet = raw.match(/^\s*[-*•]\s+(.+)/);
      const num    = raw.match(/^\s*\d+[.)]\s+(.+)/);
      if (bullet) {
        if (!inList || listTag !== "ul") { if (inList) html += `</${listTag}>`; html += "<ul>"; inList=true; listTag="ul"; }
        html += `<li>${_inline(bullet[1])}</li>`;
      } else if (num) {
        if (!inList || listTag !== "ol") { if (inList) html += `</${listTag}>`; html += "<ol>"; inList=true; listTag="ol"; }
        html += `<li>${_inline(num[1])}</li>`;
      } else {
        if (inList) { html += `</${listTag}>`; inList=false; listTag=""; }
        html += raw.trim() === "" ? "<br>" : _inline(raw) + "<br>";
      }
    }
    if (inList) html += `</${listTag}>`;
    return html.replace(/(<br>\s*)+$/, "");
  }

  function add(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + (role === "customer" ? "customer" : "agent");
    if (role === "customer") {
      el.textContent = text;
    } else {
      el.innerHTML = renderMd(text);
    }
    $("log").appendChild(el);
    $("log").scrollTop = $("log").scrollHeight;
  }
  function meta(text) {
    const el = document.createElement("div");
    el.className = "meta"; el.textContent = text;
    $("log").appendChild(el);
  }
  function setSuggestions(opts) {
    const box = $("suggestions"); box.innerHTML = "";
    (opts || []).forEach((o) => {
      const b = document.createElement("button");
      b.textContent = o; b.onclick = () => { sendText(o); box.innerHTML = ""; };
      box.appendChild(b);
    });
  }

  function _base() { return ($("base").value || window.location.origin).replace(/\/$/, ""); }
  function _token() { return $("token").value.trim(); }

  async function start() {
    const base = _base();
    const token = _token();
    const resp = await fetch(base + "/api/v1/chat/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({
        user_id: $("userid").value.trim() || null,
        customer_name: $("name").value.trim() || null,
      }),
    });
    if (!resp.ok) { alert("Failed to create session: " + resp.status); return; }
    const data = await resp.json();
    sessionId = data.session_id;
    $("setup").classList.add("hidden");
    $("log").classList.remove("hidden");
    $("composer").classList.remove("hidden");
    if (data.greeting) add("agent", data.greeting);
    $("call-btn").disabled = false;
    connect(data.ws_url);
  }

  function connect(wsUrl) {
    _wsUrl = wsUrl;
    if (_reconnectTimer) { clearTimeout(_reconnectTimer); _reconnectTimer = null; }
    ws = new WebSocket(wsUrl);
    ws.onopen = () => { $("status").textContent = "● connected"; _reconnectDelay = 2000; };
    ws.onclose = () => {
      $("status").textContent = "○ disconnected";
      if (!_sessionEnded) {
        _reconnectTimer = setTimeout(() => {
          $("status").textContent = "↻ reconnecting…";
          connect(_wsUrl);
        }, _reconnectDelay);
        _reconnectDelay = Math.min(_reconnectDelay * 2, 30000);
      }
    };
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === "typing") { $("typing").textContent = "typing…"; return; }
      $("typing").textContent = "";
      if (m.type === "message") {
        add("agent", m.text);
        if (m.sources && m.sources.length) meta("sources: " + m.sources.join(", "));
        setSuggestions(m.suggestions);
      } else if (m.type === "call_offer") {
        showCallOffer(m.reason, m.call_url);
      } else if (m.type === "mode_change") {
        if (m.mode === "awaiting_human") {
          const el = document.createElement("div");
          el.className = "meta";
          el.innerHTML = '<span style="color:#d97706;">&#x23F3; Connecting you to a support agent, please wait&hellip;</span>';
          $("log").appendChild(el);
          $("log").scrollTop = $("log").scrollHeight;
        } else if (m.mode === "human") {
          const name = m.agent_name ? m.agent_name : "a support agent";
          const el = document.createElement("div");
          el.className = "meta";
          el.innerHTML = `<span style="color:#16a34a;">&#x2713; You are now connected with ${name}</span>`;
          $("log").appendChild(el);
          $("log").scrollTop = $("log").scrollHeight;
        }
      } else if (m.type === "audio_ack") {
        if (pendingAudioBubble) {
          pendingAudioBubble.el.src = m.media_url;
          URL.revokeObjectURL(pendingAudioBubble.localUrl);
          pendingAudioBubble = null;
        }
      } else if (m.type === "history") {
        (m.messages || []).forEach(hm => {
          if (hm.media_url && hm.media_mime) {
            const mime = hm.media_mime.split(";")[0];
            const src = hm.media_url + "?session_id=" + sessionId;
            const side = (hm.role === "customer") ? "customer" : "agent";
            const wrap = document.createElement("div");
            wrap.className = "msg " + side;
            let mediaEl;
            if (mime.startsWith("image/")) {
              mediaEl = document.createElement("img");
              mediaEl.src = src;
              mediaEl.style.cssText = "max-width:200px;border-radius:8px;display:block;";
            } else if (mime.startsWith("video/")) {
              mediaEl = document.createElement("video");
              mediaEl.controls = true;
              mediaEl.src = src;
              mediaEl.style.maxWidth = "220px";
            } else if (mime.startsWith("audio/")) {
              mediaEl = document.createElement("audio");
              mediaEl.controls = true;
              mediaEl.src = src;
              mediaEl.style.maxWidth = "220px";
            }
            if (mediaEl) {
              wrap.appendChild(mediaEl);
              $("log").appendChild(wrap);
              $("log").scrollTop = $("log").scrollHeight;
            } else {
              add(side, "[media]");
            }
            return;
          }
          if (hm.role === "customer") {
            add("customer", hm.text || "");
          } else if (hm.role === "human_agent") {
            add("agent", hm.text || "");
          } else if (hm.role === "agent") {
            add("agent", hm.text || "");
          } else {
            meta(hm.text || "");
          }
        });
      } else if (m.type === "ended") {
        _sessionEnded = true;
        $("call-btn").disabled = true;
        add("agent", "— chat ended —"); $("composer").classList.add("hidden");
      } else if (m.type === "error") {
        meta("error: " + m.message);
      }
    };
  }

  // --- Voice call offer ---------------------------------------------------
  let voiceWs = null;

  function showCallOffer(reason, callUrl) {
    if (!callUrl) {
      add("agent", "⚠️ Voice call could not be set up right now. Please try again or type your question.");
      return;
    }
    // Render as a chat bubble so it's always visible in the conversation flow.
    const wrap = document.createElement("div");
    wrap.className = "msg agent";
    wrap.style.cssText = "background:#eff6ff;border:1px solid #bfdbfe;display:flex;flex-direction:column;gap:.4rem;";
    const lbl = document.createElement("span");
    lbl.textContent = "🎙 Ready to connect a voice call" + (reason ? ` — ${reason}` : "") + ".";
    const btn = document.createElement("button");
    btn.textContent = "Start Voice Call";
    btn.style.cssText = "padding:.4rem .8rem;background:#1d4ed8;color:#fff;border:0;border-radius:6px;cursor:pointer;font-weight:600;align-self:flex-start;";
    btn.onclick = () => { btn.disabled = true; btn.textContent = "Connecting…"; startVoiceCall(callUrl); };
    wrap.appendChild(lbl); wrap.appendChild(btn);
    $("log").appendChild(wrap);
    $("log").scrollTop = $("log").scrollHeight;
  }

  // Inline worklet — no external file needed (mirrors dev_console.html approach).
  const VOICE_WORKLET = `
class CaptureProcessor extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) this.port.postMessage(ch.slice(0));
    return true;
  }
}
registerProcessor('capture-processor', CaptureProcessor);
`;

  function _downsampleToInt16(float32, inRate) {
    const TARGET = 16000;
    if (inRate === TARGET) {
      const out = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i++) {
        const s = Math.max(-1, Math.min(1, float32[i]));
        out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return out;
    }
    const ratio = inRate / TARGET;
    const outLen = Math.floor(float32.length / ratio);
    const out = new Int16Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const s = Math.max(-1, Math.min(1, float32[Math.floor(i * ratio)]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  function startVoiceCall(callUrl) {
    if (!callUrl) { add("agent", "⚠️ No call URL — voice call unavailable."); return; }
    add("agent", "— connecting voice call… —");
    voiceWs = new WebSocket(callUrl);
    voiceWs.binaryType = "arraybuffer";

    let audioCtx = null, playCursor = 0, micStream = null, workletNode = null, running = false;

    function playPcm16(int16) {
      const buf = audioCtx.createBuffer(1, int16.length, 16000);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < int16.length; i++) ch[i] = int16[i] / 0x8000;
      const src = audioCtx.createBufferSource();
      src.buffer = buf; src.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (playCursor < now) playCursor = now;
      src.start(playCursor);
      playCursor += buf.duration;
    }

    function teardown(immediate) {
      running = false;
      if (workletNode) { try { workletNode.disconnect(); } catch (_) {} workletNode = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (voiceWs && voiceWs.readyState === 1) voiceWs.close();
      voiceWs = null;
      // Delay closing AudioContext so any already-scheduled audio finishes playing.
      if (audioCtx) {
        const ctx = audioCtx; audioCtx = null;
        const waitMs = immediate ? 0 : Math.max(300, (playCursor - ctx.currentTime + 0.5) * 1000);
        setTimeout(() => ctx.close(), waitMs);
      }
    }

    voiceWs.onopen = async () => {
      voiceWs.send(JSON.stringify({ type: "hello", tenant: "chat" }));
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new AudioContext({ sampleRate: 16000 });
        const blobUrl = URL.createObjectURL(new Blob([VOICE_WORKLET], { type: "application/javascript" }));
        await audioCtx.audioWorklet.addModule(blobUrl);
        workletNode = new AudioWorkletNode(audioCtx, "capture-processor");
        workletNode.port.onmessage = (e) => {
          if (!running || !voiceWs || voiceWs.readyState !== 1) return;
          voiceWs.send(_downsampleToInt16(e.data, audioCtx.sampleRate).buffer);
        };
        const src = audioCtx.createMediaStreamSource(micStream);
        const sink = audioCtx.createGain(); sink.gain.value = 0;
        src.connect(workletNode); workletNode.connect(sink).connect(audioCtx.destination);
        running = true;
        add("agent", "— voice call connected — speak now —");
      } catch (err) {
        add("agent", "⚠️ Mic error: " + err.message);
        teardown();
      }
    };

    voiceWs.onmessage = (ev) => {
      if (ev.data instanceof ArrayBuffer) {
        if (audioCtx) playPcm16(new Int16Array(ev.data));
        return;
      }
      try {
        const m = JSON.parse(ev.data);
        if (m.type === "transcript" && m.role === "agent" && m.text) add("agent", m.text);
        else if (m.type === "state" && m.state === "ended") {
          add("agent", "— voice call ended —"); teardown(false);
        }
      } catch (_) {}
    };

    voiceWs.onclose = () => { add("agent", "— voice call disconnected —"); teardown(false); };
    voiceWs.onerror = () => { add("agent", "⚠️ Voice connection error."); teardown(true); };
  }

  // --- Direct call button --------------------------------------------------
  async function initiateCall() {
    if (!sessionId) return;
    const btn = $("call-btn");
    btn.disabled = true;
    btn.textContent = "⏳";
    try {
      const r = await fetch(`${_base()}/api/v1/chat/${sessionId}/call`, { method: "POST" });
      if (!r.ok) {
        add("agent", "⚠️ Could not set up voice call (" + r.status + ").");
        btn.textContent = "📞"; btn.disabled = false;
        return;
      }
      const { call_url } = await r.json();
      btn.textContent = "📞";
      startVoiceCall(call_url);
    } catch (e) {
      add("agent", "⚠️ Call error: " + e.message);
      btn.textContent = "📞"; btn.disabled = false;
    }
  }

  $("call-btn").onclick = initiateCall;

  // --- Attachment handling ------------------------------------------------
  let pendingFile = null;

  function clearPending() {
    pendingFile = null;
    $("preview-bar").style.display = "none";
    $("preview-name").textContent = "";
    $("file-input").value = "";
  }

  $("attach-btn").onclick = () => $("file-input").click();

  const MAX_IMAGE_KB = 200, MAX_VIDEO_MB = 5;

  $("file-input").onchange = () => {
    const f = $("file-input").files[0];
    if (!f) return;
    const isVideo = f.type.startsWith("video/");
    const limitBytes = isVideo ? MAX_VIDEO_MB * 1024 * 1024 : MAX_IMAGE_KB * 1024;
    const limitLabel = isVideo ? `${MAX_VIDEO_MB} MB` : `${MAX_IMAGE_KB} KB`;
    if (f.size > limitBytes) {
      add("agent", `⚠️ File too large. Max size: ${limitLabel} for ${isVideo ? "video" : "images"}.`);
      $("file-input").value = "";
      return;
    }
    pendingFile = f;
    const sizeMB = (f.size / 1024 / 1024).toFixed(1);
    $("preview-name").textContent = `${f.name} (${sizeMB} MB)`;
    $("preview-bar").style.display = "flex";
  };

  $("preview-clear").onclick = clearPending;

  function sendMedia(file, caption) {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;           // "data:<mime>;base64,<data>"
      const comma = dataUrl.indexOf(",");
      const b64 = dataUrl.slice(comma + 1);
      const mime = file.type || "application/octet-stream";
      const mtype = mime.startsWith("video/") ? "video" : "image";
      add("customer", (caption ? caption + "\n" : "") + `[${file.name}]`);
      ws.send(JSON.stringify({ type: mtype, data: b64, mime, text: caption }));
    };
    reader.readAsDataURL(file);
  }

  function sendText(text) {
    if (!ws || ws.readyState !== 1) return;
    if (pendingFile) {
      sendMedia(pendingFile, text);
      clearPending();
      $("text").value = "";
      return;
    }
    if (!text) return;
    add("customer", text);
    ws.send(JSON.stringify({ type: "message", text: text }));
    $("text").value = "";
  }

  $("start").onclick = start;
  $("send").onclick = () => sendText($("text").value.trim());
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter") sendText($("text").value.trim()); });
  $("end").onclick = () => { if (ws && ws.readyState === 1) { _sessionEnded = true; ws.send(JSON.stringify({ type: "end" })); } };

  // ---- Voice message recording ----
  let _mediaRecorder = null;
  let _audioChunks = [];
  let _recTimerInterval = null;
  let _recSeconds = 0;
  const MAX_REC_SECONDS = 60;

  function _stopRecording() {
    if (_mediaRecorder && _mediaRecorder.state !== "inactive") {
      _mediaRecorder.stop();
    }
  }

  function addAudioBubble(src, side) {
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = src;
    audio.style.maxWidth = "220px";
    const wrap = document.createElement("div");
    wrap.className = "msg " + side;
    wrap.appendChild(audio);
    $("log").appendChild(wrap);
    $("log").scrollTop = $("log").scrollHeight;
    return audio;
  }

  window.toggleRecording = async function () {
    const btn = $("mic-btn");
    const timer = $("rec-timer");

    if (_mediaRecorder && _mediaRecorder.state === "recording") {
      _stopRecording();
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("Microphone not supported in this browser.");
      return;
    }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      alert("Microphone permission denied.");
      return;
    }

    _audioChunks = [];
    const preferredMimes = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4",
      "audio/ogg;codecs=opus",
    ];
    const mimeType = preferredMimes.find(t => MediaRecorder.isTypeSupported(t)) || "";
    _mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    const actualMime = mimeType || _mediaRecorder.mimeType || "audio/webm";

    _mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) _audioChunks.push(e.data);
    };

    _mediaRecorder.onstop = async () => {
      clearInterval(_recTimerInterval);
      timer.style.display = "none";
      btn.textContent = "🎤";
      btn.classList.remove("recording");
      stream.getTracks().forEach(t => t.stop());

      const blob = new Blob(_audioChunks, { type: actualMime });
      _audioChunks = [];

      // Show local audio bubble immediately (no server round-trip for playback)
      const localUrl = URL.createObjectURL(blob);
      const bubbleEl = addAudioBubble(localUrl, "customer");

      // Encode and send over WS
      const buf = await blob.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      const b64 = btoa(binary);
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: "audio", data: b64, mime: actualMime }));
      }

      // Track the bubble for audio_ack URL swap
      pendingAudioBubble = { el: bubbleEl, localUrl };
    };

    _mediaRecorder.start();
    btn.textContent = "⏹";
    btn.classList.add("recording");
    _recSeconds = 0;
    timer.style.display = "inline";
    timer.textContent = "0:00";

    _recTimerInterval = setInterval(() => {
      _recSeconds++;
      const m = Math.floor(_recSeconds / 60);
      const s = _recSeconds % 60;
      timer.textContent = `${m}:${s.toString().padStart(2, "0")}`;
      if (_recSeconds >= MAX_REC_SECONDS) _stopRecording();
    }, 1000);
  };
})();
</script>
</body>
</html>
