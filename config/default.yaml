app:
  name: vox-agent
  version: 1.0.0
  debug: false
  log_level: INFO

server:
  host: 0.0.0.0
  port: 8000
  workers: 4

redis:
  url: redis://localhost:6379/0
  session_ttl_seconds: 1800

database:
  url: postgresql+asyncpg://vox:vox@localhost:5432/vox_agent

pipeline:
  stt:
    provider: sarvam
    model: saaras:v3
    language: hi-IN
    confidence_threshold: 0.6
    fallback_provider: groq

  llm:
    provider: gemini
    model: gemini-3.5-flash
    temperature: 0.7
    max_tokens: 512
    response_format: json

  tts:
    provider: sarvam
    language: hi-IN
    voice_id: null
    speed: 1.0

  telephony:
    provider: twilio
    from_number: "+91XXXXXXXXXX"
    webhook_base_url: https://your-domain.example.com/api/v1/telephony

  vector_store:
    provider: pgvector
    embedding_dim: 384
    # To use FAISS instead (file-backed, no DB required):
    # provider: faiss
    # index_path: ./data/faiss_index

voice_pipeline:
  vad:
    model: silero
    threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 600
  silence:
    post_response_timeout_s: 5
    extended_timeout_s: 12
    max_call_duration_s: 420
  interruption:
    enabled: true
    detection_interval_ms: 20

rag:
  chunking:
    strategy: recursive
    chunk_size: 500
    chunk_overlap: 100
  retrieval:
    strategy: hybrid
    top_k: 5
    bm25_weight: 0.3
    dense_weight: 0.7
    # Deliberately 0.0, not a "real" threshold: this floor applies to
    # min-max-normalised fusion scores with no reranker in the loop (the
    # reranker was removed as dead code — no PRODUCTION wiring ever
    # instantiated one; some tests did).
    #
    # Know what the floor actually does before raising it. _minmax gives each
    # backend's top hit 1.0, so on the hybrid path the best dense hit always
    # scores >= dense_weight (0.7). A floor at 0.4 can therefore only empty
    # the result set on a BM25-only match (max 0.3); a floor above 0.7 empties
    # it unconditionally. Emptiness is the hazard worth respecting: an empty
    # retrieved_all silently disables apply_hallucination_guard, the same
    # dangerous state reached from a different cause in the incident at
    # src/agents/chatbot.py:112-123 (KB search sharing the CRM tool budget and
    # timing out). Raise this only after measuring against the retrieval eval
    # set.
    similarity_threshold: 0.0

compliance:
  calling_hours:
    start: "10:00"
    end: "19:00"
  dnd_check_enabled: true
  ai_disclosure: true
  max_retry_attempts: 3
  retry_interval_hours: 2
