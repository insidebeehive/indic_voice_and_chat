<!-- static/backoffice.html — ADMIN backoffice: tenant list + per-tenant
     analytics & billing. Admin bearer only; every panel is a live /api/v1 call. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vox Backoffice</title>
<style>
  :root { color-scheme: dark; }
  /* The UA stylesheet's [hidden]{display:none} loses to any author-origin
     display rule (e.g. the `label { display:flex }` below), so an element
     with `hidden` set can still render. Re-assert it here with !important so
     `el.hidden = true`/the `hidden` attribute reliably hides ANY element in
     this page, regardless of what other rules target it — this is what
     silently broke the custom-voice-id <label> toggle. */
  [hidden] { display: none !important; }
  body { font-family: system-ui, sans-serif; margin:0; background:#0a0a0a; color:#e2e8f0; }
  header { padding:.75rem 1rem; background:#3b0764; border-bottom:1px solid #1f2937; }
  header h1 { font-size:1.05rem; margin:0 0 .5rem; }
  .creds { display:flex; gap:.75rem; flex-wrap:wrap; align-items:flex-end; }
  label { font-size:.8rem; color:#cbd5e1; display:flex; flex-direction:column; gap:.2rem; }
  input { background:#0b1220; color:#e2e8f0; border:1px solid #334155; border-radius:.35rem; padding:.4rem; font:inherit; }
  button { padding:.4rem .8rem; border-radius:.4rem; border:0; cursor:pointer; font-weight:600; background:#ea580c; color:#fff; }
  .btn-sm { padding:.2rem .5rem; font-size:.78rem; }
  .btn-danger { background:#dc2626; }
  button.ghost { background:#334155; color:#e2e8f0; }
  button.sm { padding:.25rem .5rem; font-size:.75rem; }
  .wrap { padding:1rem; }
  .card { background:#0f1115; border:1px solid #1f2430; border-radius:.6rem; padding:1rem 1.1rem; margin-bottom:1rem; }
  .card h2 { font-size:.95rem; margin:.1rem 0 .7rem; color:#cbd5e1; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; }
  th, td { text-align:left; padding:.45rem .5rem; border-bottom:1px solid #1f2937; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#141a24; }
  tbody tr.sel { background:#1e293b; }
  .pill { font-size:.7rem; padding:.05rem .4rem; border-radius:.3rem; background:#334155; }
  .pill.s2s { background:#0c4a6e; } .pill.layered { background:#3f2d12; }
  .hint { color:#8a94a6; font-size:.75rem; }
  .tabs { display:flex; gap:.4rem; margin-bottom:.7rem; }
  .tab { padding:.35rem .8rem; border-radius:.4rem; background:#1a1f29; color:#cbd5e1; cursor:pointer; font-size:.85rem; }
  .tab.active { background:#3b82f6; color:#fff; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.7rem; }
  .stat { background:#0b1220; border:1px solid #243042; border-radius:.5rem; padding:.7rem .8rem; }
  .stat .v { font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat .k { font-size:.72rem; color:#8a94a6; text-transform:uppercase; letter-spacing:.03em; }
  .stat.tnt .v { color:#94a3b8; font-style:italic; }
  .kv { font-size:.82rem; } .kv div { padding:.15rem 0; border-bottom:1px solid #141a24; }
  a { color:#93c5fd; }
  table.metrics tbody tr { cursor:default; }
  table.metrics tbody tr:hover { background:transparent; }
  table.metrics th { color:#8a94a6; font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; font-weight:600; }
  table.metrics th.n, table.metrics td.n { text-align:right; font-variant-numeric:tabular-nums; }
  .metrics-wrap { overflow-x:auto; margin-bottom:.4rem; }
  .warnbox { background:#1a0f10; border:1px solid #7f1d1d; border-radius:.5rem; padding:.7rem .8rem; margin:1rem 0 .4rem; }
</style>
</head>
<body>
<header>
  <h1>Vox Backoffice <span class="hint">— tenants · analytics · billing · <a href="/admin">register</a> · <a href="/console">tenant console</a></span></h1>
  <div class="creds">
    <label>API base URL <input id="baseUrl" style="width:15rem" placeholder="(same origin)" /></label>
    <label>Admin token <input id="adminToken" style="width:16rem" placeholder="Bearer for admin routes" /></label>
    <button class="ghost sm" onclick="saveCreds()">Save</button>
    <button class="ghost sm" onclick="loadTenants()">Reload</button>
    <span id="credsHint" class="hint"></span>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Tenants <span class="hint">(click a row to see analytics &amp; billing)</span></h2>
    <div id="tlist"><span class="hint">Enter your admin token + Save to load tenants.</span></div>
  </div>

  <div class="card" id="detail" hidden>
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.5rem;">
      <h2 id="detailTitle" style="margin:0;">Tenant</h2>
      <button class="btn-danger btn-sm" onclick="rotateApiToken()">Rotate API token</button>
    </div>
    <div id="rotateResult" style="margin:.5rem 0;"></div>
    <div class="tabs">
      <div class="tab active" id="tab_an" onclick="showTab('an')">Analytics</div>
      <div class="tab" id="tab_pipe" onclick="showTab('pipe')">Pipeline</div>
      <div class="tab" id="tab_crm" onclick="showTab('crm')">CRM</div>
      <div class="tab" id="tab_camp" onclick="showTab('camp')">Campaign</div>
      <div class="tab" id="tab_chat" onclick="showTab('chat')">Chat</div>
      <div class="tab" id="tab_kb" onclick="showTab('kb')">Knowledge Base</div>
      <div class="tab" id="tab_bill" onclick="showTab('bill')">Billing</div>
      <div class="tab" id="tab_tel" onclick="showTab('tel')">Telephony</div>
      <div class="tab" id="tab_dv" onclick="showTab('dv')">Deposit verification</div>
    </div>
    <div id="pane_an"></div>
    <div id="pane_pipe" hidden></div>
    <div id="pane_crm" hidden></div>
    <div id="pane_camp" hidden></div>
    <div id="pane_chat" hidden></div>
    <div id="pane_kb" hidden></div>
    <div id="pane_bill" hidden></div>
    <div id="pane_tel" hidden></div>
    <div id="pane_dv" hidden></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function loadCreds() {
  $("baseUrl").value    = localStorage.getItem("vox_base")  || "";
  $("adminToken").value = localStorage.getItem("vox_admin") || "";
}
function saveCreds() {
  localStorage.setItem("vox_base",  $("baseUrl").value.trim());
  localStorage.setItem("vox_admin", $("adminToken").value.trim());
  $("credsHint").textContent = "saved"; setTimeout(() => $("credsHint").textContent = "", 1200);
  loadTenants();
}
const base = () => ($("baseUrl").value.trim() || window.location.origin).replace(/\/$/, "");
const fmt = (c) => "$" + (Number(c) || 0).toFixed(4);
const mins = (ms) => ((Number(ms) || 0) / 60000).toFixed(1);

async function api(path) {
  const headers = {};
  const t = $("adminToken").value.trim();
  if (t) headers["Authorization"] = "Bearer " + t;
  try {
    const res = await fetch(base() + path, { headers });
    const json = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, json };
  } catch (e) { return { ok: false, status: 0, json: { error: String(e) } }; }
}

async function apiSend(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  const t = $("adminToken").value.trim();
  if (t) headers["Authorization"] = "Bearer " + t;
  try {
    const res = await fetch(base() + path, { method, headers, body: JSON.stringify(body) });
    const json = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, json };
  } catch (e) { return { ok: false, status: 0, json: { error: String(e) } }; }
}

// Effective provider/model for one pipeline layer (LayerInfo.effective_provider
// / effective_model in src/api/tenants.py — the tenant's stored override
// merged over config/default.yaml, same merge TenantProviders._config_for
// runs at request time), marking any field this tenant did NOT set itself.
// Before this, a tenant with no stt/llm/tts override at all (running the
// platform default) rendered as a bare "—" here, identical to a genuinely
// unconfigured pipeline — see pipeLayerHtml's docstring-equivalent comment
// below for the fuller per-field version used in the editor hint.
function lay(l) {
  if (!l) return "—";
  const p = l.effective_provider, m = l.effective_model;
  if (!p && !m) return "—";
  const tag = (src) => src === "platform_default" ? " (default)" : "";
  return `${p ? p + tag(l.provider_source) : "—"}${m ? " · " + m + tag(l.model_source) : ""}`;
}

// Verbose per-field breakdown for the pipeline editor's "(current: ...)" hint
// (pipeLayerHtml) — distinguishes "inherits the platform default" from "set
// on this tenant" PER FIELD, since a tenant can pin `provider` while
// inheriting `model` (merge_provider_config merges field-by-field, not
// layer-by-layer) — a single whole-layer suffix would misreport that case as
// fully one or the other.
function layHint(l) {
  if (!l) return "—";
  const p = l.effective_provider, m = l.effective_model;
  if (!p && !m) return "—";
  const label = (src) => src === "tenant" ? "set on this tenant" : "platform default";
  if (!m) return `${p} — ${label(l.provider_source)}`;
  if (l.provider_source === l.model_source) return `${p} · ${m} — ${label(l.provider_source)}`;
  return `${p} (${label(l.provider_source)}) · ${m} (${label(l.model_source)})`;
}
let SELECTED = null;
let CHAT_WINDOW_H = 24;

async function loadTenants() {
  const r = await api("/api/v1/tenants");
  if (!r.ok) { $("tlist").innerHTML = `<span class="hint">Could not load (${r.status}). Check the admin token.</span>`; return; }
  const ts = r.json.tenants || [];
  window.TENANTS = {};
  ts.forEach(t => { window.TENANTS[t.tenant_id] = t; });
  if (!ts.length) { $("tlist").innerHTML = `<span class="hint">No tenants yet — register one on <a href="/admin">/admin</a>.</span>`; return; }
  $("tlist").innerHTML = `<table><thead><tr>
      <th>slug</th><th>name</th><th>mode</th><th>LLM</th><th>STT</th><th>TTS</th>
      <th>Realtime</th><th>Telephony</th><th>max</th><th>status</th></tr></thead>
    <tbody>${ts.map(t => `<tr data-id="${t.tenant_id}" onclick="selectTenant('${t.tenant_id}','${t.slug}')">
      <td>${t.slug}</td><td>${t.name}</td>
      <td><span class="pill ${t.mode}">${t.mode}</span></td>
      <td>${lay(t.llm)}</td><td>${lay(t.stt)}</td><td>${lay(t.tts)}</td>
      <td>${lay(t.realtime)}</td><td>${t.telephony_provider || "—"}</td>
      <td>${t.max_concurrent_calls}</td><td>${t.status}</td></tr>`).join("")}</tbody></table>`;
}

async function selectTenant(id, slug) {
  SELECTED = id;
  for (const tr of document.querySelectorAll("#tlist tbody tr"))
    tr.classList.toggle("sel", tr.dataset.id === id);
  $("detail").hidden = false;
  $("detailTitle").textContent = `Tenant: ${slug}`;
  $("rotateResult").innerHTML = "";
  showTab("an");
  await loadAnalytics(id);
  loadPipeline(id);
  loadBilling(id);
  loadTelephony(id);
  loadCRM(id, slug);
  loadCampaigns(id);
  loadChat(id, slug);
  loadKB(id, slug);
  loadDepositVerification(id);
}
function showTab(which) {
  for (const k of ["an", "pipe", "crm", "camp", "chat", "kb", "bill", "tel", "dv"]) {
    const tabEl = $("tab_" + k);
    if (tabEl) tabEl.classList.toggle("active", which === k);
    $("pane_" + k).hidden = which !== k;
  }
}

async function copyRotatedToken(btn, token) {
  try {
    await navigator.clipboard.writeText(token);
    const old = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = old; }, 1500);
  } catch (e) {
    // clipboard API unavailable/blocked — the token text below is selectable instead.
    btn.textContent = "Copy failed — select text below";
  }
}

async function rotateApiToken() {
  if (!SELECTED) return;
  const slug = (window.TENANTS[SELECTED] || {}).slug || SELECTED;
  if (!confirm(
    `Rotate the API token for "${slug}"?\n\n` +
    `This immediately invalidates the tenant's CURRENT API token. Anything using it ` +
    `right now (CRM integration, chat widget, etc.) will stop authenticating until it's ` +
    `updated with the new token. This cannot be undone.`
  )) return;

  $("rotateResult").innerHTML = `<span class="hint">rotating…</span>`;
  const r = await apiSend("POST", `/api/v1/tenants/${SELECTED}/rotate-token`, {});
  if (r.ok) {
    const token = r.json.api_token;
    $("rotateResult").innerHTML = `
      <div class="card" style="border-color:#dc2626; background:#1a0f10;">
        <div style="font-weight:700; color:#fca5a5; margin-bottom:.4rem;">
          ✓ New API token generated — save it now, it will not be shown again.
        </div>
        <pre style="white-space:pre-wrap; word-break:break-all; background:#0b1220; border:1px solid #334155; border-radius:.35rem; padding:.5rem; margin:.4rem 0; user-select:all;">${token}</pre>
        <button class="btn-sm" onclick="copyRotatedToken(this, '${token}')">Copy to clipboard</button>
      </div>`;
  } else {
    $("rotateResult").innerHTML =
      `<span class="hint">✗ rotate failed (${r.status}): ${r.json.detail || r.json.error || "error"}</span>`;
  }
}

function statBox(k, v, cls) { return `<div class="stat ${cls || ""}"><div class="v">${v}</div><div class="k">${k}</div></div>`; }
const ms0  = (v) => Math.round(Number(v) || 0) + " ms";
const pct1 = (v) => (Number(v) || 0).toFixed(1) + "%";
const n2   = (v) => (Number(v) || 0).toFixed(2);
function setChatWindow(v) { CHAT_WINDOW_H = Number(v) || 24; if (SELECTED) loadAnalytics(SELECTED); }

async function loadAnalytics(id) {
  const r = await api(`/api/v1/tenants/${id}/analytics`);
  if (!r.ok) { $("pane_an").innerHTML = `<span class="hint">analytics error ${r.status}</span>`; return; }
  const a = r.json;
  const rows = (obj) => Object.keys(obj).length
    ? Object.entries(obj).map(([k, v]) => `<div>${k}: <b>${v}</b></div>`).join("") : '<span class="hint">none</span>';

  const [cr, tmr, bmr] = await Promise.all([
    api(`/api/v1/tenants/${id}/chat-analytics`),
    api(`/api/v1/tenants/${id}/chat-turn-metrics?window_h=${CHAT_WINDOW_H}`),
    api(`/api/v1/benchmarks/turn-metrics/summary`),
  ]);
  const ca = cr.ok  ? cr.json  : null;
  const ct = tmr.ok ? tmr.json : null;
  const bm = bmr.ok ? bmr.json : null;

  // Cache-hit rate is only meaningful alongside its own coverage — see
  // ChatAnalytics.cache_metrics_turns/cache_metrics_since in src/api/tenants.py.
  // A tenant with zero chat_turn_metrics rows (e.g. everything predates
  // migration 0021_chat_turn_metrics_tokens) gets an explicit "no cache data
  // yet" message instead of a misleading "0%".
  const cacheHtml = ca && ca.cache_metrics_turns > 0
    ? `${pct1(ca.cache_hit_rate_pct)} <span class="hint">(based on ${ca.cache_metrics_turns} turn${ca.cache_metrics_turns === 1 ? "" : "s"}` +
      (ca.cache_metrics_since ? ` since ${escT(String(ca.cache_metrics_since).slice(0, 10))}` : "") + `)</span>`
    : `<span class="hint">no cache data yet</span>`;

  const modelRows = ca && ca.by_model && ca.by_model.length
    ? `<div class="metrics-wrap"><table class="metrics">
        <thead><tr><th>Provider</th><th>Model</th><th class="n">Messages</th><th class="n">Input tokens</th>
          <th class="n">Output tokens</th><th class="n">Cost (est.)</th></tr></thead>
        <tbody>${ca.by_model.slice().sort((x, y) => (Number(y.cost) || 0) - (Number(x.cost) || 0)).map(m => `<tr>
          <td>${escT(m.llm_provider)}</td>
          <td>${escT(m.llm_model)}</td>
          <td class="n">${m.message_count}</td>
          <td class="n">${m.input_tokens}</td>
          <td class="n">${m.output_tokens}</td>
          <td class="n">${fmt(m.cost)}</td>
        </tr>`).join("")}</tbody>
      </table></div>`
    : `<span class="hint">No token usage recorded yet.</span>`;

  // total_token_messages/token_data_since tell us roughly what fraction of
  // this tenant's chat history the token/cost totals above actually cover —
  // token data was only ever written for messages once cost tracking
  // existed on that write path, so this is a floor on real spend, not a
  // total, for any tenant with messages older than that. total_messages is
  // ChatSession.message_count, a separately-maintained running counter, not
  // a live count of chat_messages rows, so this is worded as "~out of" —
  // an approximate coverage indicator, not an exact fraction — rather than
  // implying the two counts are drawn from the same query.
  const coverageHtml = ca && ca.total_token_messages > 0
    ? `<span class="hint">${ca.total_token_messages} messages carry token data (~out of ${ca.total_messages} total)` +
      (ca.token_data_since ? ` since ${escT(String(ca.token_data_since).slice(0, 10))}` : "") + `</span>`
    : `<span class="hint">no token data recorded yet</span>`;

  const chatHtml = ca ? `
    <h2 style="margin:1.4rem 0 .6rem;">Chat sessions</h2>
    <div class="stats">
      ${statBox("Total sessions", ca.total_sessions)}
      ${statBox("Total messages", ca.total_messages)}
      ${statBox("Avg msgs / session", ca.avg_messages_per_session)}
      ${statBox("Escalation rate", ca.escalation_rate_pct + "%")}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-top:.8rem;">
      <div><h2>By status</h2><div class="kv">${rows(ca.by_status)}</div></div>
      <div><h2>By mode</h2><div class="kv">${rows(ca.by_mode)}</div></div>
      <div><h2>By source</h2><div class="kv">${rows(ca.by_source)}</div></div>
    </div>
    <h2 style="margin:1.4rem 0 .6rem;">Chat tokens &amp; cost</h2>
    <div class="stats">
      ${statBox("Total input tokens", ca.total_input_tokens)}
      ${statBox("Total output tokens", ca.total_output_tokens)}
      ${statBox("Total cost (est.)", fmt(ca.total_cost))}
      ${statBox("Cache-hit rate", cacheHtml)}
    </div>
    <div style="margin:.4rem 0 .2rem;">${coverageHtml}</div>
    <div class="hint" style="margin:.3rem 0 .5rem;">Cost is our own estimate from the local <code>provider_costs</code>
      rate table, not the provider's billing figure — it (and the token totals above) only reflect messages that
      carried token data (see coverage note above), so totals below full coverage are a floor, not the complete
      spend. Cache-hit rate is computed from a separate table (chat turn metrics) with its own, different coverage —
      shown in its own stat above — which is not available for older history.</div>
    <h3 style="margin:1rem 0 .5rem;font-size:.85rem;color:#cbd5e1;">By model</h3>
    ${modelRows}` : "";

  const winLabel = CHAT_WINDOW_H === 168 ? "7d" : CHAT_WINDOW_H + "h";

  // --- Voice per-turn latency (platform-wide, no tenant/window filter) ---
  let voiceTurnHtml = "";
  if (bm) {
    const combos = (bm.entries || []).slice().sort((x, y) => (Number(y.samples) || 0) - (Number(x.samples) || 0));
    const platformNote = `<div class="hint" style="margin-bottom:.5rem;">Platform-wide across all tenants and all time —
      this endpoint has no tenant or window filter, so it is <b>not</b> scoped to the selected tenant.</div>`;
    voiceTurnHtml = `
      <h2 style="margin:1.4rem 0 .3rem;">Voice per-turn latency <small class="hint">(platform-wide)</small></h2>
      ${platformNote}` + (combos.length === 0
      ? `<span class="hint">No voice turn metrics recorded yet.</span>`
      : `<div class="metrics-wrap"><table class="metrics">
          <thead><tr>
            <th>Mode</th><th>STT provider</th><th>LLM provider</th><th>TTS provider</th>
            <th class="n">Samples</th><th class="n">Avg STT</th><th class="n">Avg LLM TTFT</th>
            <th class="n">Avg LLM total</th><th class="n">Avg TTS first chunk</th><th class="n">Avg TTS total</th>
            <th class="n">Avg total latency</th><th class="n">Avg TTS segs dropped</th>
          </tr></thead>
          <tbody>${combos.map(c => `<tr>
            <td>${escT(c.mode)}</td>
            <td>${escT(c.stt_provider || "—")}</td>
            <td>${escT(c.llm_provider)}</td>
            <td>${escT(c.tts_provider || "—")}</td>
            <td class="n">${c.samples}</td>
            <td class="n">${ms0(c.avg_stt_latency_ms)}</td>
            <td class="n">${ms0(c.avg_llm_ttft_ms)}</td>
            <td class="n">${ms0(c.avg_llm_total_ms)}</td>
            <td class="n">${ms0(c.avg_tts_first_chunk_ms)}</td>
            <td class="n">${ms0(c.avg_tts_total_ms)}</td>
            <td class="n">${ms0(c.avg_total_latency_ms)}</td>
            <td class="n">${n2(c.avg_tts_segments_dropped)}</td>
          </tr>`).join("")}</tbody>
        </table></div>
        <div class="hint" style="margin-top:.3rem;">Total latency spans the full turn, including response speaking
          time; TTS first-chunk is the better proxy for perceived responsiveness. For <code>mode="s2s"</code> rows,
          compare against other s2s rows (not layered) — the anchors differ.</div>`);
  }

  // --- Chat turn/tool performance ---
  let chatPerfHtml = "";
  if (ct) {
    const t = ct.turns || {};
    const heading = `<h2 style="margin:1.4rem 0 .3rem;">Chat performance (last <span id="cp_winlabel">${winLabel}</span>)
      <select onchange="setChatWindow(this.value)" style="margin-left:.6rem;font-size:.78rem;">
        <option value="24"${CHAT_WINDOW_H === 24 ? " selected" : ""}>24h</option>
        <option value="168"${CHAT_WINDOW_H === 168 ? " selected" : ""}>7d</option>
      </select></h2>`;
    if (t.samples === 0 && !t.failed_turns) {
      chatPerfHtml = `${heading}<span class="hint">No chat turns recorded in the last ${winLabel}.</span>`;
    } else {
      const wsFailureBox = `
        <div class="warnbox">
          <div style="font-weight:700;color:#fca5a5;margin-bottom:.5rem;">WS-layer turn failures — excluded from the numbers above</div>
          <div class="stats">
            ${statBox("Failed turns", t.failed_turns)}
            ${statBox("Turn failure rate", pct1(t.turn_failure_rate_pct))}
          </div>
          <div class="hint" style="margin-top:.5rem;">These are WS-layer failures — turns that raised or timed out
            before the agent produced a result. Their numeric/boolean fields are 0/false placeholders, so they're
            excluded from every average/percentile/rate above. Denominator = completed turns + failed turns.</div>
        </div>`;
      if (t.samples === 0 && t.failed_turns > 0) {
        chatPerfHtml = `${heading}<span class="hint">No completed turns in the last ${winLabel} — no averages available.</span>${wsFailureBox}`;
      } else {
        const toolRows = (ct.tools || []).slice().sort((x, y) =>
          (Number(y.failure_rate_pct) || 0) - (Number(x.failure_rate_pct) || 0) ||
          (Number(y.p95_latency_ms)   || 0) - (Number(x.p95_latency_ms)   || 0) ||
          String(x.tool_name).localeCompare(String(y.tool_name)));
        const toolTable = !ct.tools || !ct.tools.length
          ? `<span class="hint">No tool calls in the last ${winLabel}.</span>`
          : `<div class="metrics-wrap"><table class="metrics">
              <thead><tr>
                <th>Tool</th><th class="n">Calls</th><th class="n">p50</th><th class="n">p95</th>
                <th class="n">Budget slice avg</th><th class="n">Timeouts</th><th class="n">Transport errors</th>

              </tr>`).join("")}</tbody>
            </table></div>
            <div class="hint" style="margin-top:.3rem;">Failure rate = (timeouts + transport errors + errors + skipped)
              / calls. Skipped calls are excluded from p50/p95. Compare p95 against budget slice to see if a tool is
              saturating its timeout.</div>`;
        chatPerfHtml = `${heading}
          <div class="stats">
            ${statBox("Turn samples", t.samples)}
            ${statBox("Avg turn", ms0(t.avg_total_ms))}
            ${statBox("p50 turn", ms0(t.p50_total_ms))}
            ${statBox("p95 turn", ms0(t.p95_total_ms))}
            ${statBox("Avg LLM", ms0(t.avg_llm_total_ms))}
            ${statBox("Avg tools", ms0(t.avg_tool_total_ms))}
            ${statBox("Avg KB search", ms0(t.avg_kb_search_ms))}
            ${statBox("Avg rounds", n2(t.avg_rounds))}
          </div>
          <h2 style="margin:1.2rem 0 .6rem;">Quality &amp; degradation</h2>
          <div class="stats">
            ${statBox("Rounds exhausted", pct1(t.rounds_exhausted_rate_pct))}
            ${statBox("Retry fired", pct1(t.retry_fired_rate_pct))}
            ${statBox("Failure directive", pct1(t.failure_directive_fired_rate_pct))}
            ${statBox("Guard: hallucination", pct1(t.guard_hallucination_fired_rate_pct))}
            ${statBox("Guard: no grounding", pct1(t.guard_no_grounding_fired_rate_pct))}
            ${statBox("Guard: unverified data", pct1(t.guard_unverified_data_fired_rate_pct))}
            ${statBox("Escalated", pct1(t.escalated_rate_pct))}

          </div>
          <div class="hint" style="margin-top:.4rem;">Rates are % of completed turns (${t.samples} samples).</div>
          ${wsFailureBox}

          ${toolTable}`;
      }
    }
  }

  $("pane_an").innerHTML = `
    <h2 style="margin:0 0 .6rem;">Voice calls</h2>
    <div class="stats">
      ${statBox("Total calls", a.total_calls)}

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-top:.8rem;">

      <div><h2>By outcome</h2><div class="kv">${rows(a.by_outcome)}</div></div>
      <div><h2>By campaign</h2><div class="kv">${rows(a.by_campaign || {})}</div></div>
      <div><h2>By call type</h2><div class="kv">${rows(a.by_agent_type || {})}</div></div>
      <div><h2>By channel</h2><div class="kv">${rows(a.by_channel || {})}</div></div>
      <div><h2>By provider</h2><div class="kv">${rows(a.by_provider || {})}</div></div>

// --- Pipeline editor ------------------------------------------------------
// Lets an admin change a tenant's mode + STT/LLM/TTS/realtime/chat-voice
// provider & model choices without touching the DB. PATCHes
// /api/v1/tenants/{id} with a `pipeline` block (see PipelineUpdateIn).
//
// Every provider/model select defaults to a "leave unchanged" sentinel
// (empty value) rather than being pre-selected to the current value: model
// lists come from the live catalog (GET /api/v1/models) so a deprecated
// model simply isn't offered, and the sentinel means "untouched" fields can
// never be silently re-sent with a stale value — the field is only included
// in the PATCH body when the admin actually picks something. The current
// value is shown as a hint next to each field instead.
let MODELS = {};
let MODELS_LOADED = false;
// Chat-voice current state (enabled / effective TTS provider) is NOT exposed
// by any GET today — only a PATCH response echoes it back. This session-only
// cache remembers the last value this page saw for a tenant so the hint text
// can show it after a save; before any save this session it just says so.
let CHAT_VOICE_CACHE = {};

async function ensureModelsLoaded() {
  if (MODELS_LOADED) return;
  const r = await api("/api/v1/models");
  if (r.ok) { MODELS = r.json.models || {}; MODELS_LOADED = true; }
}

function onPipeProviderChange(kind) {
  const catKind = kind === "realtime" ? "s2s" : (kind === "cv_tts" ? "tts" : kind);
  const prov = ($(`p_${kind}_provider`) || {}).value || "";
  const models = prov ? ((MODELS[catKind] && MODELS[catKind][prov]) || []) : [];
  const modelSel = $(`p_${kind}_model`);
  if (modelSel) {
    modelSel.innerHTML = `<option value="">— leave unchanged —</option>` +
      models.map(m => `<option value="${escAttr(m)}">${escT(m)}</option>`).join("");
  }
  // The three voice-bearing layers also need their picker re-queried: a
  // provider change usually means a different roster entirely (see
  // resolveVoiceQuery/refreshVoiceOptions below).
  if (kind === "tts" || kind === "cv_tts" || kind === "realtime") refreshVoiceOptions(kind);
}

// --- Voice picker (catalog-backed, GET /api/v1/voices) --------------------
// Shared by the three free-text voice fields this replaces: call TTS
// (p_tts_*), chat-voice TTS (p_cv_tts_*), and realtime/S2S (p_realtime_*).
// Written once and parameterized by `kind` rather than three times, per the
// task brief — the three pickers differ only in which language-input id
// feeds them and which "current" value they fall back to.
//
// PIPE_CURRENT[kind] = {provider, language} seeds the query when the operator
// hasn't touched the provider select or typed a language — see
// resolveVoiceQuery(). Populated fresh by loadPipeline() on every tenant
// selection/reload.
let PIPE_CURRENT = {};

// voice roster cache: "<provider>|<language>" -> voices array, so flipping
// back and forth between two languages/providers for the same layer — or
// across the three pickers sharing a provider — doesn't re-fetch the
// identical roster. A failed fetch is deliberately NOT cached here (see
// refreshVoiceOptions) so retrying (e.g. by re-picking the provider) can
// recover from a transient error instead of being stuck on it.
let VOICE_ROSTER_CACHE = {};

function voicePickerFieldIds(kind) {
  // Realtime stores its language under `language_code` (TenantRealtimeConfig)
  // — a different input id than the `language` field tts/cv_tts use
  // (TenantTTSConfig) — everything else follows the `p_${kind}_*` convention.
  return {
    provider: `p_${kind}_provider`,
    language: kind === "realtime" ? "p_realtime_language_code" : `p_${kind}_language`,
    select: `p_${kind}_voice_select`,
    customWrap: `p_${kind}_voice_custom_wrap`,
    custom: `p_${kind}_voice_custom`,
    msg: `p_${kind}_voice_msg`,
  };
}

function resolveVoiceQuery(kind) {
  const ids = voicePickerFieldIds(kind);
  const current = PIPE_CURRENT[kind] || {};
  // Provider to query: the newly picked provider, or — the common case of an
  // operator changing only the voice — the tenant's current stored provider.
  // Keying off the dropdown alone would leave the list empty in exactly that
  // case, since the dropdown sits at "— leave unchanged —".
  const provider = (($(ids.provider) || {}).value || "") || current.provider || "";
  // Language to query: the typed language field, else the layer's stored
  // language, else hi-IN. Per-language rosters (sarvam/azure/google/indicf5)
  // genuinely differ by language, so this must track the language input.
  const typedLanguage = (($(ids.language) || {}).value || "").trim();
  const language = typedLanguage || current.language || "hi-IN";
  return { provider, language };
}

function onVoiceSelectChange(kind) {
  const ids = voicePickerFieldIds(kind);
  const wrap = $(ids.customWrap);
  if (wrap) wrap.hidden = (($(ids.select) || {}).value !== "__custom__");
}

// The value savePipeline() should send for this layer's voice field, or ""
// (meaning: leave unchanged) for both the sentinel and a blank custom entry.
function voiceFieldValue(kind) {
  const ids = voicePickerFieldIds(kind);
  const sel = ($(ids.select) || {}).value || "";
  if (sel === "__custom__") return (($(ids.custom) || {}).value || "").trim();
  return sel;
}

function voicePickerHtml(kind, label, currentVoiceId) {
  const hint = currentVoiceId
    ? `current: ${escT(currentVoiceId)}`
    : (kind === "cv_tts"
        ? "current chat-voice TTS config isn't exposed by any GET until you save here"
        : "current: —");
  return `
    <label>${label} voice <small class="hint">(${hint})</small>
      <select id="p_${kind}_voice_select" onchange="onVoiceSelectChange('${kind}')">
        <option value="">— leave unchanged —</option>
        <option value="__custom__">custom / other…</option>
      </select>
    </label>
    <label id="p_${kind}_voice_custom_wrap" hidden>${label} custom voice id
      <input id="p_${kind}_voice_custom" placeholder="exact voice id (e.g. a cloned ElevenLabs voice)" />
    </label>
    <div id="p_${kind}_voice_msg" class="hint" style="flex-basis:100%;"></div>`;
}

async function refreshVoiceOptions(kind) {
  const ids = voicePickerFieldIds(kind);
  const select = $(ids.select);
  const msg = $(ids.msg);
  if (!select) return;   // picker not rendered for this tenant/tab right now
  // Guards a stale response landing after the operator switches tenants
  // mid-fetch: the picker element ids are identical across tenants, so
  // without this a slow response for tenant A would overwrite the picker
  // loadPipeline just built fresh for tenant B (same pattern loadPipeline
  // itself uses around its own await, see the SELECTED check there).
  const tenantAtStart = SELECTED;
  const { provider, language } = resolveVoiceQuery(kind);
  const keepValue = select.value;   // preserve the pick (incl. "__custom__") across a language-only edit
  if (!provider) {
    select.innerHTML = `<option value="">— leave unchanged —</option><option value="__custom__">custom / other…</option>`;
    if (keepValue === "__custom__") select.value = "__custom__";
    onVoiceSelectChange(kind);   // keep the custom-input wrapper's visibility in sync with the restored value
    if (msg) msg.textContent = "pick a provider above (or leave the tenant's current one) to list voices";
    return;
  }
  const cacheKey = `${provider}|${language}`;
  let voices = VOICE_ROSTER_CACHE[cacheKey];
  if (voices === undefined) {
    const r = await api(`/api/v1/voices?provider=${encodeURIComponent(provider)}&language=${encodeURIComponent(language)}`);
    if (tenantAtStart !== SELECTED) return;   // a different tenant's render now owns these element ids
    if (!r.ok) {
      // A failed catalog fetch must not block configuration — custom entry
      // stays usable even when the picker itself couldn't populate. Not
      // cached: a transient failure shouldn't stick once the fetch is retried
      // (e.g. by switching providers and back).
      if (msg) msg.textContent = `could not load voices for ${provider} (status ${r.status}) — use custom`;
      voices = null;
    } else {
      voices = r.json.voices || [];
      VOICE_ROSTER_CACHE[cacheKey] = voices;
    }
  }
  const opts = [`<option value="">— leave unchanged —</option>`];
  if (voices && voices.length) {
    voices.forEach(v => {
      // Gender in the label, not just the id: the voicebot prompt selects
      // gendered Hindi/Marathi forms off the roster's gender field, so a
      // gender flip from picking the wrong voice_id is a content bug.
      const label = v.gender ? `${v.voice_id} (${v.gender})` : v.voice_id;
      opts.push(`<option value="${escAttr(v.voice_id)}">${escT(label)}</option>`);
    });
  }
  opts.push(`<option value="__custom__">custom / other…</option>`);
  select.innerHTML = opts.join("");
  const keepValueSelectable = keepValue === "__custom__" || (voices && voices.some(v => v.voice_id === keepValue));
  if (keepValueSelectable) select.value = keepValue;
  // A non-empty prior pick that the new roster no longer offers (a
  // provider/language switch with no overlapping voice ids) MUST be called
  // out here — silently reverting to the sentinel while saying nothing is
  // exactly how a tenant ends up with a saved voice_id that doesn't match
  // its saved language (see savePipeline: only the touched fields PATCH).
  // This branch always wins over the generic empty/success messages below.
  if (keepValue && keepValue !== "__custom__" && !keepValueSelectable && voices !== null) {
    if (msg) msg.textContent = `previously selected voice "${keepValue}" isn't offered for ${provider}/${language} — selection cleared, pick a new voice or use custom`;
  } else if (voices && voices.length) {
    if (msg) msg.textContent = "";
  } else if (voices !== null) {
    // Empty roster is a real, reachable state (an unsupported language for a
    // per-language provider — the catalog deliberately does not fall back to
    // hi-IN here, see src/providers/voice_catalog.py) — not a fetch failure.
    // An empty <select> alone can't be told apart from one, so say so.
    if (msg) msg.textContent = `no voices published for ${provider}/${language} — use custom`;
  }
  onVoiceSelectChange(kind);   // re-sync the custom-input wrapper for whichever value ended up selected
}

function pipeLayerHtml(kind, label, current, extraHtml) {
  const catKind = kind === "realtime" ? "s2s" : kind;
  const providers = Object.keys(MODELS[catKind] || {});
  return `
    <div class="creds" style="gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem;">
      <label>${label} provider <small class="hint">(current: ${layHint(current)})</small>
        <select id="p_${kind}_provider" onchange="onPipeProviderChange('${kind}')">
          <option value="">— leave unchanged —</option>
          ${providers.map(p => `<option value="${escAttr(p)}">${escT(p)}</option>`).join("")}
        </select>
      </label>
      <label>${label} model
        <select id="p_${kind}_model">
          <option value="">— leave unchanged —</option>
        </select>
      </label>
      ${extraHtml || ""}
    </div>`;
}

function chatVoiceHtml(id) {
  const cache = CHAT_VOICE_CACHE[id];
  const curLabel = cache
    ? `current (as of last save this session): ${cache.enabled ? "enabled" : "disabled"}${cache.tts_provider ? " · effective tts=" + escT(cache.tts_provider) : ""}`
    : "current on/off state isn't exposed by the API until you save here";
  const providers = Object.keys(MODELS.tts || {});
  return `
    <h2 style="margin-top:1.2rem;">Chat voice replies</h2>
    <div class="hint" style="margin-bottom:.5rem;">
      Voice-note replies in the <b>chat</b> channel — a separate setting from the call TTS above.
      A tenant can run S2S for calls and still need a TTS here for chat voice notes. If left unset,
      chat voice falls back to the call TTS (pipeline.tts); if enabled with neither set, saving is
      rejected. <br /><small class="hint">${curLabel}</small>
    </div>
    <div class="creds" style="gap:.6rem;flex-wrap:wrap;">
      <label>Enabled
        <select id="p_cv_enabled">
          <option value="">— leave unchanged —</option>
          <option value="true">enabled</option>
          <option value="false">disabled</option>
        </select>
      </label>
      <label>Chat TTS provider
        <select id="p_cv_tts_provider" onchange="onPipeProviderChange('cv_tts')">
          <option value="">— leave unchanged —</option>
          ${providers.map(p => `<option value="${escAttr(p)}">${escT(p)}</option>`).join("")}
        </select>
      </label>
      <label>Chat TTS model
        <select id="p_cv_tts_model"><option value="">— leave unchanged —</option></select>
      </label>
      <label>Chat TTS language <input id="p_cv_tts_language" placeholder="blank = leave unchanged" onchange="refreshVoiceOptions('cv_tts')" /></label>
      <label>Chat TTS speed <input id="p_cv_tts_speed" type="number" step="0.05" placeholder="blank = leave unchanged" /></label>
      ${voicePickerHtml("cv_tts", "Chat TTS", null)}
    </div>`;
}

async function loadPipeline(id) {
  await ensureModelsLoaded();
  if (SELECTED !== id) return;   // a different tenant may have been selected while this awaited
  const t = (window.TENANTS || {})[id] || {};
  const stt = t.stt || {}, llm = t.llm || {}, tts = t.tts || {}, realtime = t.realtime || {};
  // Seeds for each voice picker's provider/language fallback (resolveVoiceQuery)
  // when the operator hasn't touched those fields. `realtime` already carries
  // `language`/`voice_id` — not `language_code`/`voice` — thanks to the
  // _layer() mapping in src/api/tenants.py, so no per-kind translation is
  // needed here. chat_voice's own tts config has no GET representation at all
  // (see the CHAT_VOICE_CACHE comment above); the fallback consistent with
  // its documented runtime behavior ("if left unset, chat voice falls back to
  // the call TTS") is the call TTS layer itself.
  const cvCache = CHAT_VOICE_CACHE[id];
  PIPE_CURRENT = {
    tts: { provider: tts.provider || "", language: tts.language || "" },
    realtime: { provider: realtime.provider || "", language: realtime.language || "" },
    cv_tts: { provider: (cvCache && cvCache.tts_provider) || tts.provider || "", language: tts.language || "" },
  };
  $("pane_pipe").innerHTML = `
    <div class="hint" style="margin-bottom:.6rem;">
      Change this tenant's mode and provider/model choices. PATCHes <code>/api/v1/tenants/${id}</code>
      with a <code>pipeline</code> block — only fields you touch are sent; anything left at
      "— leave unchanged —" keeps its current stored value untouched. Model lists come from the live
      model catalog, so a deprecated model can't be picked by accident.
    </div>
    <h2>Mode</h2>
    <div class="creds" style="gap:.6rem;margin-bottom:.5rem;">
      <label>Mode <small class="hint">(current: ${escT(t.mode || "—")})</small>
        <select id="p_mode">
          <option value="">— leave unchanged —</option>
          <option value="layered">layered</option>
          <option value="s2s">s2s</option>
        </select>
      </label>
    </div>
    <h2>Call pipeline (layered mode)</h2>
    ${pipeLayerHtml("stt", "STT", stt, `
      <label>STT language <input id="p_stt_language" placeholder="blank = leave unchanged" /></label>`)}
    ${pipeLayerHtml("llm", "LLM", llm)}
    ${pipeLayerHtml("tts", "TTS (call)", tts, `
      <label>TTS language <input id="p_tts_language" placeholder="blank = leave unchanged" onchange="refreshVoiceOptions('tts')" /></label>
      <label>TTS speed <input id="p_tts_speed" type="number" step="0.05" placeholder="blank = leave unchanged" /></label>
      ${voicePickerHtml("tts", "TTS", tts.voice_id)}`)}
    <h2 style="margin-top:1rem;">Realtime (S2S mode)</h2>
    ${pipeLayerHtml("realtime", "Realtime", realtime, `
      <label>Realtime language_code <input id="p_realtime_language_code" placeholder="blank = leave unchanged" onchange="refreshVoiceOptions('realtime')" /></label>
      ${voicePickerHtml("realtime", "Realtime", realtime.voice_id)}`)}
    ${chatVoiceHtml(id)}
    <div style="margin-top:1rem;">
      <button id="p_save_btn" onclick="savePipeline('${id}')">Save pipeline</button>
      <span id="p_result" class="hint" style="margin-left:.6rem;"></span>
    </div>
    <div id="p_error" style="margin-top:.6rem;"></div>`;
  // Populate the three pickers now that their <select>s exist in the DOM.
  // Fire-and-forget: each is an independent async fetch, and the pickers
  // render their own "loading"/error state via refreshVoiceOptions' msg line.
  refreshVoiceOptions("tts");
  refreshVoiceOptions("realtime");
  refreshVoiceOptions("cv_tts");
}

function formatApiError(json) {
  const d = json && json.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(e => (e && (e.msg || JSON.stringify(e))) || String(e)).join("\n");
  if (d) return JSON.stringify(d, null, 2);
  return (json && json.error) || "unknown error";
}

async function savePipeline(id) {
  const v = (x) => { const el = $(x); return el ? (el.value || "").trim() : ""; };
  const layer = (kind, fields) => {
    const obj = {};
    const provider = v(`p_${kind}_provider`);
    const model = v(`p_${kind}_model`);
    if (provider) obj.provider = provider;
    if (model) obj.model = model;
    for (const f of fields) {
      const val = v(`p_${kind}_${f}`);
      if (val) obj[f] = f === "speed" ? Number(val) : val;
    }
    return Object.keys(obj).length ? obj : null;
  };

  const pipeline = {};
  const mode = v("p_mode");
  if (mode) pipeline.mode = mode;

  const stt = layer("stt", ["language"]);
  if (stt) pipeline.stt = stt;
  const llm = layer("llm", []);
  if (llm) pipeline.llm = llm;

  // voice_id/voice come from the catalog-backed picker (voiceFieldValue), not
  // a plain input, so they're merged in separately from `layer()`'s `fields`
  // list — but must still be checked, since a bare voice pick with provider
  // and language both left unchanged should still produce a non-null layer.
  const tts = layer("tts", ["language", "speed"]) || {};
  const ttsVoice = voiceFieldValue("tts");
  if (ttsVoice) tts.voice_id = ttsVoice;
  if (Object.keys(tts).length) pipeline.tts = tts;

  const realtime = layer("realtime", ["language_code"]) || {};
  const realtimeVoice = voiceFieldValue("realtime");
  if (realtimeVoice) realtime.voice = realtimeVoice;
  if (Object.keys(realtime).length) pipeline.realtime = realtime;

  const cvEnabled = v("p_cv_enabled");
  const cvTts = layer("cv_tts", ["language", "speed"]) || {};
  const cvVoice = voiceFieldValue("cv_tts");
  if (cvVoice) cvTts.voice_id = cvVoice;
  const chatVoice = {};
  if (cvEnabled) chatVoice.enabled = cvEnabled === "true";
  if (Object.keys(cvTts).length) chatVoice.tts = cvTts;
  if (Object.keys(chatVoice).length) pipeline.chat_voice = chatVoice;

  if (!Object.keys(pipeline).length) { $("p_result").textContent = "Nothing changed — pick a value to update first."; return; }

  const btn = $("p_save_btn");
  btn.disabled = true;
  $("p_result").textContent = "saving…";
  $("p_error").innerHTML = "";
  const r = await apiSend("PATCH", `/api/v1/tenants/${id}`, { pipeline });
  btn.disabled = false;
  if (r.ok) {
    CHAT_VOICE_CACHE[id] = { enabled: r.json.chat_voice_enabled, tts_provider: r.json.chat_voice_tts_provider };
    $("p_result").textContent = "✓ saved";
    await loadTenants();   // refresh table + window.TENANTS with the now-effective values
    loadPipeline(id);      // re-render so hints reflect the new current values
  } else {
    $("p_result").textContent = `✗ save failed (${r.status})`;
    $("p_error").innerHTML = `<div class="warnbox">
      <div style="font-weight:700;color:#fca5a5;margin-bottom:.4rem;">Rejected — nothing was saved</div>
      <pre style="white-space:pre-wrap;word-break:break-word;margin:0;">${escT(formatApiError(r.json))}</pre>
    </div>`;
    // Form is left exactly as entered so the admin can fix and retry.
  }
}

// Registering the LLM tool for this requires ALL of: enabled, webhook_url,
// AND a resolvable shared secret (see src/bootstrap.py:558-566) — a tenant
// with `enabled: true` and nothing else PATCHed is fully valid and changes
// NOTHING, because the tool still never registers. `deposit_verification_active`
// (src/api/tenants.py) mirrors that gate; this pane exists specifically so an
// operator can't mistake "I flipped enabled" for "it's working" — see
// dvStateHtml's warning branch below.
function dvStateHtml(t) {
  if (!t.deposit_verification_enabled) {
    return `<div class="hint">Deposit verification is <b>off</b> for this tenant. The LLM tool is not registered.</div>`;
  }
  if (t.deposit_verification_active) {
    return `<div class="hint">Deposit verification is <b>on and active</b> — the LLM tool is registered.</div>`;
  }
  // enabled but NOT active — name exactly which of the two API-visible
  // requirements is missing (bootstrap.py's third requirement, a running
  // sessionmaker, isn't checkable from here — see TenantSummary's comment).
  const missing = [];
  if (!t.deposit_verification_webhook_url) missing.push("a webhook URL");
  if (!t.deposit_verification_secret_set) missing.push("a resolvable webhook secret");
  return `<div class="warnbox">
    <div style="font-weight:700;color:#fca5a5;margin-bottom:.4rem;">Enabled but INERT — missing ${escT(missing.join(" and "))}</div>
    <div>"Enabled" is set, but the tool is <b>not registered</b> and this feature does <b>nothing</b> right now —
    the LLM will never offer deposit verification to a customer. Set ${escT(missing.join(" and "))} below and save
    to actually turn it on.</div>
  </div>`;
}

async function saveCampaign(tenantId, campId) {
  const v = (x) => ($(x).value || "").trim();
  const knowledge = {};
  document.querySelectorAll("#c_knowledge [data-kn-row]").forEach(row => {
    const k = (row.querySelector("[data-kn-key]").value || "").trim();
    const val = (row.querySelector("[data-kn-val]").value || "").trim();
    if (k) knowledge[k] = val;
  });
  const body = {
    name: v("c_name"), agent_name: v("c_agent_name"), company: v("c_company"),
    role: v("c_role"), personality: v("c_personality"), language: v("c_language"),
    gender: v("c_gender"), conversation_style: v("c_conversation_style"),
    max_turns: Number(v("c_max_turns")) || 0,
    greeting: v("c_greeting"), objective: v("c_objective"), closing: v("c_closing"),
    talking_points: _toList(v("c_talking_points")), dos: _toList(v("c_dos")),
    donts: _toList(v("c_donts")), knowledge,
  };
  $("c_result").textContent = "saving…";
  const r = await apiSend("PUT", `/api/v1/tenants/${tenantId}/campaigns/${campId}`, body);
  if (r.ok) {
    CAMPAIGNS[campId] = r.json;        // refresh from the server's re-parsed script
    $("c_result").textContent = "✓ saved — live on the next call";
  } else {
    $("c_result").textContent = `✗ ${r.status}: ${r.json.detail || r.json.error || "error"}`;
  }
}

async function apiTenant(method, path, body, slug) {
  const headers = { "Content-Type": "application/json", "X-Tenant-Slug": slug };
  const t = $("adminToken").value.trim();
  if (t) headers["Authorization"] = "Bearer " + t;
  try {
    const res = await fetch(base() + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const json = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, json };
  } catch (e) { return { ok: false, status: 0, json: { error: String(e) } }; }
}

  if (crmCfg.x_api_key)   $("ch_xapikey").placeholder = "... (already set — leave blank to keep)";
  if (crmCfg.operator_id) $("ch_opid").value          = crmCfg.operator_id;
}

// --- Chat tab ------------------------------------------------------------

async function loadChat(id, slug) {
  const [tr, cr, rr] = await Promise.all([
    apiTenant("GET", "/api/v1/chat/tools", null, slug),
    apiSend("GET", `/api/v1/tenants/${id}/chat-config`),
    apiTenant("GET", "/api/v1/chat/tools/resolved", null, slug),
  ]);
  const tools = tr.ok ? (tr.json.tools || []) : [];
  const cfg   = cr.ok ? cr.json : {};
  const cw    = cfg.chatwoot || {};

  const toolRows = tools.length
    ? tools.map(t => `<tr>
        <td>${escT(t.name)}</td>
        <td style="max-width:22rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escAttr(t.endpoint)}">${escT(t.endpoint)}</td>
        <td>${escT(t.auth_type || "—")}</td>
        <td>${t.auth_configured ? "✓" : "—"}</td>
        <td><button class="ghost sm" onclick="deleteTool('${escAttr(slug)}','${escAttr(t.name)}')">Remove</button></td>
      </tr>`).join("")
    : `<tr><td colspan="5" class="hint">No tools registered yet.</td></tr>`;

  const resolved = rr.ok ? rr.json : null;
  const resolvedTools = resolved ? (resolved.tools || []) : [];
  const resolvedSource = resolved ? resolved.source : null;

  const resolvedHint = !resolved
    ? "Could not load active tools."
    : resolvedSource === "tenant"
      ? "Using this tenant's own registered tools (below)."
      : resolvedSource === "crm_catalog"
        ? "Using the linked CRM's tool catalog — no tenant-specific tools registered."
        : "No tools active — no tenant registration and no CRM linked (link a CRM in the CRM tab, or configure this tenant's own CRM credentials there).";

  const resolvedRows = resolvedTools.length
    ? resolvedTools.map(t => `<tr>
        <td>${escT(t.name)}</td>
        <td style="max-width:22rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escAttr(t.endpoint)}">${escT(t.endpoint)}</td>
        <td>${escT(t.auth_type || "—")}</td>
        <td>${t.token_configured ? "✓" : "—"}</td>
      </tr>`).join("")
    : `<tr><td colspan="4" class="hint">No tools active.</td></tr>`;

  $("pane_chat").innerHTML = `
    <h2>Active tools <small class="hint">(what this tenant actually gets right now)</small></h2>
    <div class="hint" style="margin-bottom:.4rem;">${escT(resolvedHint)}</div>
    <table style="margin-bottom:1.2rem;">
      <thead><tr><th>Name</th><th>Endpoint</th><th>Auth type</th><th>Token configured</th></tr></thead>
      <tbody id="ch_resolved_rows">${resolvedRows}</tbody>
    </table>

    <h2>Registered tools <small class="hint">(per-tenant overrides)</small></h2>
    <div class="hint" style="margin-bottom:.4rem;">Platform catalog tools are used automatically. Tools here override or extend the catalog.</div>
    <table style="margin-bottom:.8rem;">
      <thead><tr><th>Name</th><th>Endpoint</th><th>Auth type</th><th>Token set</th><th></th></tr></thead>
      <tbody id="ch_toolrows">${toolRows}</tbody>
    </table>

    <h2 style="margin-top:1.2rem;">Chatwoot integration</h2>
    <div class="hint" style="margin-bottom:.5rem;">
      Credentials used to deliver bot replies back to Chatwoot (Agent Bot mode).
      Webhook URL to set in Chatwoot: <code>/api/v1/integrations/chatwoot/webhook</code>
      — no Authorization header needed; tenant is identified via the <strong>Inbox ID</strong> below.
    </div>
    <div class="creds" style="gap:.6rem;flex-wrap:wrap;">
      <label>Inbox ID <small class="hint">(from Chatwoot Settings → Inboxes)</small>
        <input id="cw_inbox" style="width:10rem" placeholder="not set" />
      </label>
      <label>Account ID
        <input id="cw_account" style="width:10rem" placeholder="not set" />
      </label>
      <label>Chatwoot URL <small class="hint">(blank = app.chatwoot.com)</small>
        <input id="cw_url" style="width:20rem" placeholder="https://app.chatwoot.com" />
      </label>
      <label>API access token <small class="hint">(encrypted at rest)</small>
        <input id="cw_token" type="password" style="width:20rem" placeholder="token value" />
      </label>
    </div>
    <div style="margin-top:.8rem;">
      <button onclick="saveChatwootConfig('${escAttr(slug)}')">Save Chatwoot config</button>
      <span id="cw_result" class="hint" style="margin-left:.6rem;"></span>
    </div>`;

  if (cw.inbox_id)   $("cw_inbox").value        = cw.inbox_id;
  if (cw.account_id) $("cw_account").value       = cw.account_id;
  if (cw.api_url)    $("cw_url").value           = cw.api_url;
  if (cw.api_token)  $("cw_token").placeholder   = "... (already set — leave blank to keep)";
}

async function saveChatwootConfig(slug) {
  const inbox_id   = $("cw_inbox").value.trim();
  const api_url    = $("cw_url").value.trim();
  const account_id = $("cw_account").value.trim();
  const api_token  = $("cw_token").value.trim();
  if (!inbox_id)   { $("cw_result").textContent = "Inbox ID is required"; return; }
  if (!account_id) { $("cw_result").textContent = "Account ID is required"; return; }
  const cw = { inbox_id, account_id };
  if (api_url)   cw.api_url   = api_url;
  if (api_token) cw.api_token = api_token;
  $("cw_result").textContent = "saving…";
  const tid = SELECTED;
  const r = await apiSend("PATCH", `/api/v1/tenants/${tid}`, { chatwoot: cw });
  $("cw_result").textContent = r.ok ? "✓ Chatwoot config saved" : `Error ${r.status}: ${r.json.detail || JSON.stringify(r.json)}`;
}

async function saveCrmConfig(slug) {
  // "" (the "— none —" option) explicitly clears the link; the backend tells
  // "clear" apart from "leave untouched" only because this key is always sent.
  const crm_id = $("ch_crm_id").value;
  $("ch_result").textContent = "saving…";
  const tid = SELECTED;
  const r = await apiSend("PATCH", `/api/v1/tenants/${tid}`, { crm_id });
  if (r.ok) {
    await loadTenants();   // refresh window.TENANTS so the dropdown reflects the new link
    loadCRM(tid, slug);
    $("ch_result").textContent = "✓ CRM link saved";
  } else {
    $("ch_result").textContent = `Error ${r.status}: ${r.json.detail || JSON.stringify(r.json)}`;
  }
}

async function saveCrmAuth(slug) {
  const api_token   = $("ch_token").value.trim();
  const x_api_key   = $("ch_xapikey").value.trim();
  const operator_id = $("ch_opid").value.trim();
  const crm = {};
  if (api_token)   crm.api_token   = api_token;
  if (x_api_key)   crm.x_api_key   = x_api_key;
  if (operator_id) crm.operator_id = operator_id;
  $("ch_auth_result").textContent = "saving…";
  const tid = SELECTED;
  const r = await apiSend("PATCH", `/api/v1/tenants/${tid}`, { crm });
  $("ch_auth_result").textContent = r.ok ? "✓ CRM auth saved" : `Error ${r.status}: ${r.json.detail || JSON.stringify(r.json)}`;
}

async function deleteTool(slug, name) {
  if (!confirm(`Remove tool "${name}"?`)) return;
  const r = await apiTenant("DELETE", `/api/v1/chat/tools/${encodeURIComponent(name)}`, null, slug);
  if (r.ok) {
    const row = document.querySelector(`#ch_toolrows tr td:first-child`);
    // Reload the whole pane — find the tenant id from SELECTED
    const t = (window.TENANTS || {})[SELECTED] || {};
    loadChat(SELECTED, t.slug || slug);
  }
}

// ── Knowledge Base ─────────────────────────────────────────────
async function downloadKBDoc(path, filename, slug) {
  const headers = {};
  const tok = $("adminToken").value.trim();
  if (tok) headers["Authorization"] = "Bearer " + tok;
  if (slug) headers["X-Tenant-Slug"] = slug;
  const res = await fetch(base() + path, { headers });
  if (!res.ok) { alert("Download failed: " + res.status); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function _kbDocRow(doc, onDelete, downloadPath, slug) {
  const lang = doc.language ? `<span class="hint">${doc.language}</span>` : "—";
  const dlName = escA(doc.filename).replace(/\.[^.]+$/, "") + ".txt";
  const slugArg = slug ? `,'${escA(slug)}'` : ",null";
  return `<tr>
    <td>${escA(doc.filename)}</td>
    <td style="text-align:right">${doc.chunk_count}</td>
    <td>${lang}</td>
    <td style="white-space:nowrap;display:flex;gap:.3rem;">
      <button class="btn-sm" onclick="downloadKBDoc('${downloadPath}','${dlName}'${slugArg})">↓ Download</button>
      <button class="btn-sm btn-danger" onclick="${onDelete}('${escA(doc.id)}')">Delete</button>
    </td>
  </tr>`;
}

function _kbTable(rows) {
  if (!rows.length) return '<span class="hint">No documents.</span>';
  return `<table style="width:100%;border-collapse:collapse;font-size:.85rem;">
    <thead><tr><th style="text-align:left">File</th><th style="text-align:right">Chunks</th><th>Lang</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

async function deleteTenantDoc(docId) {
  if (!confirm("Delete this document?")) return;
  const t = (window.TENANTS || {})[SELECTED] || {};
  const r = await apiTenant("DELETE", `/api/v1/knowledge/documents/${docId}`, null, t.slug);
  if (r.ok) loadKB(SELECTED, t.slug);
  else alert("Delete failed: " + (r.json?.detail || r.status));
}

async function uploadKBDoc(isPlatform, slug) {
  const fileEl = $("kb_tenant_file");
  if (!fileEl.files.length) return;
  const fd = new FormData(); fd.append("file", fileEl.files[0]);
  const headers = {};
  const tok = $("adminToken").value.trim();
  if (tok) headers["Authorization"] = "Bearer " + tok;
  headers["X-Tenant-Slug"] = slug;
  const res = await fetch(base() + "/api/v1/knowledge/ingest", { method: "POST", headers, body: fd });
  const json = await res.json().catch(() => ({}));
  if (res.ok) {
    fileEl.value = "";
    const t = (window.TENANTS || {})[SELECTED] || {};
    loadKB(SELECTED, t.slug);
  } else {
    alert("Upload failed: " + (json?.detail || res.status));
  }
}

async function ingestLayoutDoc(slug) {
  const sel = $("kb_layout_select");
  const layout = sel ? sel.value : "";
  const resultEl = $("kb_layout_result");
  if (!layout) { resultEl.textContent = "Select a doc first."; return; }
  resultEl.textContent = "ingesting…";
  const r = await apiTenant("POST", "/api/v1/knowledge/ingest-layout", { layout }, slug);
  if (r.ok) {
    const docs = r.json.documents || [];
    const totalChunks = docs.reduce((n, d) => n + (d.chunks_indexed || 0), 0);
    resultEl.textContent = `✓ ingested ${docs.length} doc${docs.length === 1 ? "" : "s"} (${totalChunks} chunks)`;
    const t = (window.TENANTS || {})[SELECTED] || {};
    loadKB(SELECTED, t.slug);
  } else {
    resultEl.textContent = `✗ ${r.status}: ${r.json.detail || "error"}`;
  }
}

async function loadKB(id, slug) {
  const pane = $("pane_kb");
  pane.innerHTML = '<span class="hint">Loading…</span>';

  const crmId = (window.TENANTS || {})[id]?.crm_id || null;
  const [cr, tr] = await Promise.all([
    crmId ? apiSend("GET", `/api/v1/crms/${encodeURIComponent(crmId)}/kb/documents`) : Promise.resolve({ ok: false }),
    slug ? apiTenant("GET", "/api/v1/knowledge/documents", null, slug) : Promise.resolve({ ok: false }),
  ]);

  const crmRows = (cr.ok ? cr.json.documents || [] : [])
    .map(d => `<tr><td>${escA(d.filename)}</td><td style="text-align:right">${d.chunk_count}</td>
      <td>${d.language ? `<span class="hint">${d.language}</span>` : "—"}</td></tr>`).join("");
  const tenantRows = (tr.ok ? tr.json.documents || [] : [])
    .map(d => _kbDocRow(d, "deleteTenantDoc", `/api/v1/knowledge/documents/${d.id}/download`, slug)).join("");

  pane.innerHTML = `
    <div class="card" style="margin-bottom:1rem;">
      <div class="card-label">Active CRM docs <span class="hint">(from linked CRM${crmId ? "" : " — none linked"}; manage on the CRM admin page)</span></div>
      ${crmId
        ? (crmRows
          ? `<table style="width:100%;border-collapse:collapse;font-size:.85rem;">
               <thead><tr><th style="text-align:left">File</th><th style="text-align:right">Chunks</th><th>Lang</th></tr></thead>
               <tbody>${crmRows}</tbody></table>`
          : '<span class="hint">No documents.</span>')
        : '<span class="hint">This tenant isn\'t linked to a CRM (see the CRM tab).</span>'}
    </div>
    <div class="card">
      <div class="card-label">Tenant Knowledge Base <span class="hint">(${escA(slug || id)})</span></div>
      ${tr.ok ? _kbTable(tenantRows) : '<span class="hint">Select a tenant to view its documents.</span>'}
      ${slug ? `<div style="margin-top:.8rem;display:flex;gap:.5rem;align-items:center;">
        <input type="file" id="kb_tenant_file" accept=".pdf,.docx,.txt,.md" style="flex:1;font-size:.8rem;" />
        <button class="btn-sm" onclick="uploadKBDoc(false,'${slug}')">Upload</button>
      </div>
      <div style="margin-top:.6rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
        <select id="kb_layout_select" style="font-size:.8rem;">
          <option value="">— select doc —</option>
          <optgroup label="Frontend layouts">
            <option value="layout-1">layout-1</option>
            <option value="layout-2">layout-2</option>
            <option value="layout-3">layout-3</option>
            <option value="layout-4">layout-4</option>
            <option value="layout-5">layout-5</option>
            <option value="layout-6">layout-6</option>
            <option value="layout-7">layout-7</option>
            <option value="layout-8">layout-8</option>
            <option value="layout-9">layout-9</option>
            <option value="layout-sports">layout-sports</option>
          </optgroup>
          <optgroup label="Product modules">
            <option value="casino">casino</option>
            <option value="sports">sports</option>
            <option value="matka">matka</option>
          </optgroup>
        </select>
        <button class="btn-sm" onclick="ingestLayoutDoc('${slug}')">Ingest KB doc</button>
        <span id="kb_layout_result" class="hint"></span>
      </div>` : ""}
    </div>`;
}

loadCreds(); loadTenants();
// Render the KB pane's empty state immediately (no tenant selected yet)
loadKB(null, null);
</script>
