id: t_example
slug: example
name: Example Telecom
status: active
default_language: hi

pipeline:
  stt:
    provider: sarvam
    model: saaras:v3
    language: hi-IN
    # no api_key_env needed — STT/LLM/TTS/realtime always use the platform master key
  llm:
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.7
    # no api_key_env needed — STT/LLM/TTS/realtime always use the platform master key
  tts:
    provider: sarvam
    model: bulbul:v3
    language: hi-IN
    voice_id: priya  # bulbul:v2 + anushka were deprecated 2026-09; priya is v3's female equivalent
    # no api_key_env needed — STT/LLM/TTS/realtime always use the platform master key
  # Chat voice-note replies — opt-in, off by default (TTS bills per reply).
  # Uncomment to enable. With `tts:` omitted, chat reuses pipeline.tts above;
  # spell out a `tts:` block to give chat its own voice. A tenant with neither
  # simply gets text-only chat replies.
  # chat_voice:
  #   enabled: true
  #   tts:
  #     provider: sarvam
  #     model: bulbul:v3
  #     language: hi-IN
  #     voice_id: priya
  telephony:
    provider: twilio
    from_number: "+918888888888"
    account_sid_env: TENANT_EXAMPLE_TWILIO_SID
    auth_token_env: TENANT_EXAMPLE_TWILIO_TOKEN
  vector_store:
    provider: faiss

compliance:
  calling_hours_start: "10:00"
  calling_hours_end: "19:00"
  dnd_check_enabled: true

crm:
  kind: fake

whatsapp:
  provider: fake

phone_numbers:
  - "+918888888888"
